name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - UI/UX
        - Course content
        - Analytics/Time tracking
        - Authentication
        - Community/Live features
        - CLI/Course generation
        - Documentation
        - Testing
        - Infrastructure/CI
        - Other
    validations:
      required: true
