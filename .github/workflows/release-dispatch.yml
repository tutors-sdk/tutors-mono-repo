name: Release Candidate Dispatch

# A push to a release branch becomes a release candidate:
#
#   1. candidate  tag the pushed commit vX.Y.Z-rc.N (next free N)
#   2. images     build and publish the candidate's images from that tag, and
#                 wait until the registry serves them
#   3. dispatch   ask tutors-sdk/tutors-release-harness to judge the candidate
#                 beside the production tag (repository_dispatch,
#                 event_type release-candidate), naming the images by digest and
#                 the Rules the release defines
#   4. report     hand the run over to release-harness-report.yml, which posts
#                 the harness's verdict on the release pull request
#
# Setup, the HARNESS_TOKEN secret and the payload are documented in
# guides/Release-Strategy.md#release-harness.
#
# Two things this workflow is careful about:
#
#   - A tag created with GITHUB_TOKEN does not start other workflows, so the
#     `v*` tag trigger of image-build.yml never fires for the tag made here.
#     The images job starts image-build.yml itself with workflow_dispatch on
#     the tag ref (workflow_dispatch is the documented exception to that rule)
#     and watches that run. Until image-build.yml exists with a
#     workflow_dispatch trigger the job says so and moves on: the harness
#     builds a missing tag from the git ref instead.
#   - The production tag is read from the reader overlay on main. On the
#     release branch the overlay already names the version being released.
#     So are the production digests: the `digest:` of each overlay on main.

on:
  push:
    branches: ["release/**"]

# One candidate at a time per branch, and never cancel between tagging and
# dispatching: a tag without a harness run is a candidate nobody judged.
concurrency:
  group: release-dispatch-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  HARNESS_REPO: tutors-sdk/tutors-release-harness
  IMAGE_WORKFLOW: image-build.yml
  IMAGE_PREFIX: quay.io/tutors-sdk/tutors-

jobs:
  candidate:
    name: Tag the candidate
    if: github.repository == 'tutors-sdk/tutors-mono-repo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the vX.Y.Z-rc.N tag ref
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      candidate: ${{ steps.tag.outputs.candidate }}
      production: ${{ steps.production.outputs.production }}
      migrations_a: ${{ steps.production.outputs.migrations_a }}
      production_digests: ${{ steps.production_digests.outputs.production_digests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # release/16.3.0 and release/v16.3.0 are both in use. The branch is a
      # candidate once package.json carries the branch's version (step 3 of the
      # release cut); pushes before that, and pushes to a retained branch whose
      # release has shipped, are not candidates.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Branch $GITHUB_REF_NAME does not name a version (expected release/X.Y.Z or release/vX.Y.Z)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          package="$(node -p "require('./package.json').version")"
          if [ "$package" != "$version" ]; then
            echo "::notice::package.json is at $package, the branch says $version. Not a candidate until the version is bumped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "::warning::v$version is already tagged. A retained release branch must not move after its release ships; nothing dispatched."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f release/claims.yaml ]; then
            echo "::error file=release/claims.yaml::release/claims.yaml is missing. A release carries one; claims: [] means nothing observable should differ."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Read the production tag from main
        id: production
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          production="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/deploy/k8s/overlays/reader/kustomization.yaml?ref=main" \
            | sed -n 's/^[[:space:]]*newTag:[[:space:]]*"\{0,1\}\([^"[:space:]]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n 1)"
          if ! printf '%s' "$production" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not read images[].newTag from the reader overlay on main (got '$production')."
            exit 1
          fi
          # Production's migrations come from its tag; releases before tagging
          # was routine only have their retained branch.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$production" --silent 2>/dev/null; then
            migrations_a="v$production"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$production" --silent 2>/dev/null; then
            migrations_a="release/$production"
          else
            echo "::error::Production is $production but neither tag v$production nor branch release/$production exists."
            exit 1
          fi
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "migrations_a=$migrations_a" >> "$GITHUB_OUTPUT"

      # Optional payload field production_digests: the digest each overlay on main
      # pins, read like newTag above. All four or none: a partial record would
      # let the harness pin some apps by digest and judge the rest by tag.
      - name: Read the production digests from main
        id: production_digests
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digests='{}'
          for app in reader catalogue live time; do
            digest="$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/deploy/k8s/overlays/$app/kustomization.yaml?ref=main" 2>/dev/null \
              | sed -n 's/^[[:space:]]*digest:[[:space:]]*"\{0,1\}\(sha256:[0-9a-f]\{64\}\)"\{0,1\}[[:space:]]*\(#.*\)\{0,1\}$/\1/p' | head -n 1)" || digest=""
            if [ -z "$digest" ]; then
              echo "::notice::The $app overlay on main has no readable digest; production_digests is left out of the dispatch."
              echo "production_digests=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            digests="$(jq -c --arg app "$app" --arg digest "$digest" '. + {($app): $digest}' <<< "$digests")"
          done
          echo "production_digests=$digests" >> "$GITHUB_OUTPUT"

      # Created through the API: no git credentials on disk, and a ref that
      # already exists is refused, so two runs cannot both take the same N.
      # A re-run of this workflow reuses the rc tag already on this commit.
      - name: Tag the next release candidate
        id: tag
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION-rc." \
            --jq '.[] | [.ref, .object.sha] | @tsv')"
          existing="$(printf '%s\n' "$refs" | awk -v sha="$GITHUB_SHA" -F '\t' '$2 == sha { sub("refs/tags/v", "", $1); print $1; exit }')"
          if [ -n "$existing" ]; then
            echo "This commit is already tagged v$existing; reusing it."
            candidate="$existing"
          else
            last="$(printf '%s\n' "$refs" | sed -n "s|^refs/tags/v$VERSION-rc\.\([0-9][0-9]*\)[[:space:]].*|\1|p" | sort -n | tail -n 1)"
            candidate="$VERSION-rc.$(( ${last:-0} + 1 ))"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$candidate" -f "sha=$GITHUB_SHA" --silent
            echo "Tagged $GITHUB_SHA as v$candidate."
          fi
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Candidate \`v$candidate\` at \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Publish the candidate's images
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write # start image-build.yml on the tag and watch the run
      contents: read
    outputs:
      published: ${{ steps.build.outputs.published }}
      candidate_digests: ${{ steps.digests.outputs.candidate_digests }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
    steps:
      - name: Build the images from the tag
        id: build
        run: |
          tag="v$CANDIDATE"
          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/$IMAGE_WORKFLOW?ref=$tag" 2>/dev/null \
            | grep -Eq '^[[:space:]]*workflow_dispatch:'; then
            echo "::warning::$IMAGE_WORKFLOW is not on $tag or has no workflow_dispatch trigger. No images published; the harness will build $tag from the git ref."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$IMAGE_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$tag"

          run=""
          for _ in $(seq 1 30); do
            sleep 10
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$IMAGE_WORKFLOW" --event workflow_dispatch \
              --commit "$GITHUB_SHA" --limit 20 --json databaseId,headBranch,createdAt \
              --jq "[.[] | select(.headBranch == \"$tag\" and .createdAt >= \"$started\")][0].databaseId // empty")"
            [ -n "$run" ] && break
          done
          if [ -z "$run" ]; then
            echo "::error::Started $IMAGE_WORKFLOW on $tag but no run appeared within five minutes."
            exit 1
          fi
          echo "Image build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The run succeeding is not the contract; the registry serving the tag
      # is. Anonymous, because the harness pulls anonymously too.
      - name: Wait for the registry to serve every image
        if: steps.build.outputs.published == 'true'
        run: |
          for app in reader catalogue live time; do
            image="$IMAGE_PREFIX$app:$CANDIDATE"
            for attempt in $(seq 1 20); do
              if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
                echo "OK: $image"
                continue 2
              fi
              echo "waiting for $image ($attempt/20)"
              sleep 15
            done
            echo "::error::$image is not in the registry after the image build succeeded."
            exit 1
          done

      # Optional payload field candidate_digests: what the registry serves for
      # each tag, so the harness pulls exactly these images and its release
      # record keeps them. The digest of the tag's manifest (the index, for a
      # multi-arch image), the same one `pnpm deploy:pin` reads. All four or
      # none: the previous step has just seen every tag, so a miss here is odd
      # and the harness is better off with the bare tags than with a partial set.
      - name: Read the candidate's digests from the registry
        id: digests
        if: steps.build.outputs.published == 'true'
        run: |
          digests='{}'
          for app in reader catalogue live time; do
            image="$IMAGE_PREFIX$app:$CANDIDATE"
            if ! digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}' 2>/dev/null)" \
              || ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::warning::Could not read the digest of $image; candidate_digests is left out of the dispatch."
              echo "candidate_digests=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$image -> $digest"
            digests="$(jq -c --arg app "$app" --arg digest "$digest" '. + {($app): $digest}' <<< "$digests")"
          done
          echo "candidate_digests=$digests" >> "$GITHUB_OUTPUT"

  # Optional payload field rules_url: the Rules the release defines, as rules.json
  # (pnpm release:rules). The harness needs a URL it can GET without credentials,
  # so the file is an asset of a prerelease named for the rc tag:
  # https://github.com/<repo>/releases/download/vX.Y.Z-rc.N/rules.json. The rc tag
  # is immutable and the file is a function of the commit it names, so the URL
  # never changes meaning. A prerelease made with GITHUB_TOKEN starts no workflow,
  # and this job is best-effort: without a rules_url the dispatch still goes out
  # and only a claim that names a `rule` needs the file.
  rules:
    name: Publish the candidate's Rules
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write # create the rc prerelease and attach rules.json
    outputs:
      rules_url: ${{ steps.publish.outputs.rules_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .

      - name: Publish rules.json as an asset of the rc prerelease
        id: publish
        run: |
          pnpm --silent release:rules --ref "$GITHUB_SHA" --out rules.json
          tag="v$CANDIDATE"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "$tag" --notes "Release candidate $tag. The assets are inputs of the release harness; the candidate's images are published by image-build.yml."
          fi
          gh release upload "$tag" rules.json --repo "$GITHUB_REPOSITORY" --clobber
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/rules.json"
          echo "rules_url=$url" >> "$GITHUB_OUTPUT"
          echo "Rules: $url" >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Dispatch the release harness
    needs: [candidate, images, rules]
    if: needs.candidate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      dispatched_at: ${{ steps.send.outputs.dispatched_at }}
    steps:
      # client_payload is the contract of .github/workflows/release.yml in the
      # harness. Required: production, candidate. Sent always: claims_url, runs,
      # migrations_a, migrations_b. Optional, sent when there is something to
      # send (harness contract 1.3.0; an older harness ignores unknown fields):
      # production_digests, candidate_digests, rules_url.
      - name: Send release-candidate
        id: send
        env:
          GH_TOKEN: ${{ secrets.HARNESS_TOKEN }}
          PRODUCTION: ${{ needs.candidate.outputs.production }}
          CANDIDATE: ${{ needs.candidate.outputs.candidate }}
          MIGRATIONS_A: ${{ needs.candidate.outputs.migrations_a }}
          PUBLISHED: ${{ needs.images.outputs.published }}
          PRODUCTION_DIGESTS: ${{ needs.candidate.outputs.production_digests }}
          CANDIDATE_DIGESTS: ${{ needs.images.outputs.candidate_digests }}
          RULES_URL: ${{ needs.rules.outputs.rules_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The HARNESS_TOKEN secret is not set. See guides/Release-Strategy.md#release-harness."
            exit 1
          fi
          claims_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/release/claims.yaml"
          jq -n \
            --arg production "$PRODUCTION" \
            --arg candidate "$CANDIDATE" \
            --arg claims_url "$claims_url" \
            --arg migrations_a "$MIGRATIONS_A" \
            --arg migrations_b "$GITHUB_SHA" \
            --argjson production_digests "${PRODUCTION_DIGESTS:-null}" \
            --argjson candidate_digests "${CANDIDATE_DIGESTS:-null}" \
            --arg rules_url "$RULES_URL" \
            '{event_type: "release-candidate", client_payload: ({production: $production, candidate: $candidate, claims_url: $claims_url, runs: 5, migrations_a: $migrations_a, migrations_b: $migrations_b}
              + (if $production_digests then {production_digests: $production_digests} else {} end)
              + (if $candidate_digests then {candidate_digests: $candidate_digests} else {} end)
              + (if $rules_url != "" then {rules_url: $rules_url} else {} end))}' \
            > payload.json
          jq . payload.json
          # Taken just before the call: release-harness-report.yml looks for the
          # harness run that started after this moment.
          echo "dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "repos/$HARNESS_REPO/dispatches" --input payload.json
          {
            echo "Dispatched \`release-candidate\` to [$HARNESS_REPO]($GITHUB_SERVER_URL/$HARNESS_REPO/actions/workflows/release.yml)"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| production (a) | \`$PRODUCTION\` |"
            echo "| candidate (b) | \`$CANDIDATE\` |"
            echo "| images published | $PUBLISHED |"
            echo "| claims | $claims_url |"
            echo "| migrations | \`$MIGRATIONS_A\` to \`$GITHUB_SHA\` |"
            echo "| runs | $(jq -r .client_payload.runs payload.json) |"
            echo "| production digests | $(jq -r 'if .client_payload.production_digests then "pinned" else "not sent" end' payload.json) |"
            echo "| candidate digests | $(jq -r 'if .client_payload.candidate_digests then "pinned" else "not sent" end' payload.json) |"
            echo "| rules | $(jq -r '.client_payload.rules_url // "not sent"' payload.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The harness never writes to pull requests, so the verdict reaches the release
  # pull request from here: release-harness-report.yml waits for the harness run
  # and posts (or updates) one comment. It is a workflow of its own because the
  # wait can take an hour, and this workflow's concurrency group must be free for
  # the next push. Started from the default branch: the code that holds the
  # harness token and the pull-request permission is the code on main, never the
  # release branch's copy. Best-effort: a failure here is a warning, and the
  # candidate has been tagged and dispatched either way.
  report:
    name: Hand over to the report workflow
    needs: [candidate, dispatch]
    if: needs.candidate.outputs.ready == 'true' && needs.dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write # start release-harness-report.yml
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CANDIDATE: ${{ needs.candidate.outputs.candidate }}
      PRODUCTION: ${{ needs.candidate.outputs.production }}
      DISPATCHED_AT: ${{ needs.dispatch.outputs.dispatched_at }}
    steps:
      - name: Start release-harness-report.yml
        run: |
          if ! gh workflow run release-harness-report.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "candidate=$CANDIDATE" -f "production=$PRODUCTION" -f "branch=$GITHUB_REF_NAME" \
            -f "sha=$GITHUB_SHA" -f "dispatched_at=$DISPATCHED_AT"; then
            echo "::warning::Could not start release-harness-report.yml on $DEFAULT_BRANCH; the harness verdict will not be posted on the release pull request."
            echo "The harness verdict will not be posted on the release pull request: release-harness-report.yml could not be started on \`$DEFAULT_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Started [release-harness-report.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release-harness-report.yml): it posts the harness verdict for \`$CANDIDATE\` on the release pull request." >> "$GITHUB_STEP_SUMMARY"
