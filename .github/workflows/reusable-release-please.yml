name: Reusable Release Please

# The release front end, callable from any workflow in this repository or any
# other (uses: tutors-sdk/tutors-mono-repo/.github/workflows/reusable-release-please.yml@<sha>).
# guides/Release-Capability.md is the guide.
#
#   1. gate     open or update the release pull request only when a feature,
#               a breaking change or a Release-As footer has landed in a
#               released path since that path's last release tag. Fixes and
#               chores wait and ship with the next minor. force-release opens
#               the pull request anyway, for an urgent patch.
#   2. token    mint a GitHub App token, so the release pull request's CI starts
#               without approval and its tags count as real events. Without
#               the app it falls back to GITHUB_TOKEN with a warning.
#   3. release  release-please keeps one pull request with the version bumps
#               and changelogs; merging it tags and creates the GitHub releases.
#
# The caller reads releases_created and paths_released and publishes in the
# same run, so nothing waits on a tag event that GITHUB_TOKEN would swallow.

on:
  workflow_call:
    inputs:
      config-file:
        description: release-please config, relative to the repository root
        type: string
        default: release-please-config.json
      manifest-file:
        description: release-please manifest, relative to the repository root
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch the release pull request targets (empty means the default branch)
        type: string
        default: ''
      force-release:
        description: Open the release pull request even if only fixes landed
        type: boolean
        default: false
      make-latest:
        description: Let these releases become the repository's Latest release (false when another product owns that badge)
        type: boolean
        default: true
      app-client-id:
        description: Client ID of the release GitHub App (pass vars.RELEASE_APP_CLIENT_ID); empty means GITHUB_TOKEN
        type: string
        default: ''
    secrets:
      app_private_key:
        description: Private key (.pem) of the release GitHub App
        required: false
    outputs:
      releases_created:
        description: "'true' when merging the release pull request created at least one release"
        value: ${{ jobs.release-please.outputs.releases_created }}
      paths_released:
        description: JSON array of the package paths released by this run
        value: ${{ jobs.release-please.outputs.paths_released }}
      release_outputs:
        description: Every release-please output as one JSON object (per path, <path>--version, <path>--tag_name, ...)
        value: ${{ jobs.release-please.outputs.release_outputs }}
      app_token:
        description: "'true' when the run used the release app's token"
        value: ${{ jobs.release-please.outputs.app_token }}

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # release commits, tags and GitHub releases
      pull-requests: write # open and update the release pull request
    env:
      # Secrets cannot appear in an if:, so the mint step reads this instead.
      HAS_APP_KEY: ${{ secrets.app_private_key != '' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released || '[]' }}
      release_outputs: ${{ toJSON(steps.release.outputs) }}
      app_token: ${{ steps.app-token.outcome == 'success' }}

    steps:
      # The branch release-please targets, so the gate reads that branch's
      # config, tags and commits, not the ref that triggered the run.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target-branch || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # A path is due when a commit that touched it since its last release tag
      # is a feat, carries `!` or BREAKING CHANGE, or has a Release-As footer.
      # Paths with no tag yet count from the config's bootstrap-sha. Merging
      # an open release pull request still tags and publishes: only the pull
      # request step is skipped.
      - name: Decide whether a release is due
        id: gate
        env:
          FORCE: ${{ inputs.force-release }}
          CONFIG: ${{ inputs.config-file }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced by workflow_dispatch"
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An open release pull request keeps updating with every later fix,
          # so its changelog stays complete.
          open_prs=$(gh pr list --repo "$REPO" --state open --label 'autorelease: pending' --json number --jq length)
          if [ "$open_prs" -gt 0 ]; then
            echo "A release pull request is already open; keeping it up to date"
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          worthy='^(feat(\([^)]*\))?!?|[a-z]+(\([^)]*\))?!): |^BREAKING[ -]CHANGE: |^Release-As: '
          bootstrap=$(jq -r '."bootstrap-sha" // empty' "$CONFIG")
          separator=$(jq -r '."tag-separator" // "-"' "$CONFIG")
          # A package's commits are those under its path and not under a
          # deeper package's path, as release-please splits them, so the root
          # package "." does not count a feat in packages/jsr.
          mapfile -t all_paths < <(jq -r '.packages | keys[]' "$CONFIG")
          due=false
          while IFS=$'\t' read -r path component with_component; do
            if [ "$with_component" = "true" ]; then
              pattern="${component}${separator}v[0-9]*.[0-9]*.[0-9]*"
            else
              pattern="v[0-9]*.[0-9]*.[0-9]*"
            fi
            # Candidate tags (vX.Y.Z-rc.N) also match the pattern; the last
            # release is the last final tag, or a second rc is never due.
            last=$(git describe --tags --abbrev=0 --match "$pattern" --exclude '*-rc.*' HEAD 2>/dev/null || true)
            base=${last:-$bootstrap}
            pathspec=("$path")
            for other in "${all_paths[@]}"; do
              if [ "$other" != "$path" ] && { [ "$path" = "." ] || [[ "$other" == "$path"/* ]]; }; then
                pathspec+=(":(exclude)$other")
              fi
            done
            if git log "${base:+$base..}HEAD" --format=%B -- "${pathspec[@]}" | grep -qE "$worthy"; then
              echo "$path: release-worthy commits since ${base:-the start}"
              due=true
            else
              echo "$path: only fixes and chores since ${base:-the start}"
            fi
          done < <(jq -r '
            (if has("include-component-in-tag") then ."include-component-in-tag" else true end) as $top
            | .packages | to_entries[]
            | [ .key,
                (.value.component // .value["package-name"] // .key),
                ((if .value | has("include-component-in-tag") then .value["include-component-in-tag"] else $top end) | tostring) ]
            | @tsv' "$CONFIG")
          if [ "$due" = "true" ]; then
            echo "skip-pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "Not opening a release pull request"
            echo "skip-pr=true" >> "$GITHUB_OUTPUT"
          fi

      # Events raised with GITHUB_TOKEN start no other workflow, so a release
      # pull request opened with it waits for someone to approve its CI. A
      # GitHub App token has no such limit.
      - name: Mint release token
        id: app-token
        if: inputs.app-client-id != '' && env.HAS_APP_KEY == 'true'
        # A bad key or a missing installation must not stop releases.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app_private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Warn when the release token could not be minted
        if: steps.app-token.outcome != 'success'
        run: echo "::warning title=Release app token::This run uses GITHUB_TOKEN, so the release pull request's CI waits for approval. Set up the release app (guides/Release-Capability.md)."

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
          skip-github-pull-request: ${{ steps.gate.outputs.skip-pr }}

      # GitHub marks the newest release Latest. In a repository whose Latest
      # belongs to another product (the apps, here), unmark the ones just made.
      - name: Keep these releases from becoming Latest
        if: ${{ !inputs.make-latest && steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          for tag in $(jq -r 'to_entries[] | select(.key | endswith("--tag_name")) | .value' <<< "$OUTPUTS"); do
            gh release edit "$tag" --repo "$REPO" --latest=false
          done
