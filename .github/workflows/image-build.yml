name: Container Image Build

# Builds the four Tutors app images from the root Dockerfile
# (--build-arg APP_NAME=<app>, see deploy/README.md) and publishes them to
# quay.io/tutors-sdk/tutors-<app>.
#
#   pull_request            linux/amd64 build and Trivy scan only, nothing is pushed
#   push to main            push  sha-<short>  and  main
#   push to rc/**           push  sha-<short>  and the branch name with "/" as "-"
#                           (rc/16.2.0 becomes rc-16.2.0)
#   push tag vX.Y.Z         PROMOTE the release candidate's image: retag the digest of
#                           X.Y.Z-rc.N (highest N) as X.Y.Z, X.Y, latest and
#                           sha-<short>, nothing rebuilt, when that image was built
#                           from the same git tree and its signature verifies. When
#                           it cannot be promoted the images are rebuilt and the run
#                           says REBUILT in a warning and the job summary (or fails,
#                           with require_promotion). Per app, see "Promotion" below
#   push tag vX.Y.Z-rc.N    push  X.Y.Z-rc.N  and  sha-<short>  only; a
#                           prerelease never moves X.Y or latest
#   workflow_dispatch       on a v* tag only: the same as that tag's push
#                           (a final tag promotes, an rc tag builds).
#                           release-dispatch.yml creates rc tags with the
#                           workflow token, whose pushes start no workflow,
#                           so it starts this one explicitly
#   workflow_dispatch       backfill: run from main with release_tag=vX.Y.Z
#     with release_tag      to publish a release tagged before this workflow
#                           existed (its own copy of the file is missing, so
#                           dispatching on the tag itself cannot work). Pushes
#                           X.Y.Z, X.Y and sha-<short>, never latest; the
#                           Trivy scan reports but does not stop it, because
#                           the image is already what production runs
#
# Published images are linux/amd64 + linux/arm64. The amd64 image is scanned
# with Trivy before anything is pushed; CRITICAL and HIGH findings with an
# available fix stop the workflow. The pushed digest is then signed with
# cosign (keyless, GitHub OIDC) and carries an SPDX SBOM attestation. The
# release harness verifies both, see "Verifying an image" in deploy/README.md.
#
# Promotion. The release harness judges the X.Y.Z-rc.N images, so the final
# tag must ship those images, not a rebuild with a new digest. scripts/
# promote-image.ts decides per app: it promotes only when the registry has
# X.Y.Z-rc.N, the git tree of v<X.Y.Z-rc.N> equals the tree of the final tag's
# commit, the image's revision label is the rc commit and its cosign signature
# (image-build.yml at that rc tag) verifies. The promoted digest keeps its
# signature and SBOM attestation, which are attached by digest. Every build,
# sign and attest step below is skipped for a promoted app; the test
# tests/conformance/promote-image.test.ts holds the workflow to that. Trivy runs
# again, against the promoted digest, before any tag moves. Whether an app was
# promoted is the `promoted` output of the "Decide" step and the first line of
# its job summary. Run it with --dry-run locally: pnpm promote:image plan
# --app reader --ref v16.3.0 --dry-run.

on:
  push:
    branches: [main, "rc/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Backfill only: an existing vX.Y.Z tag to build and publish (run from main). Leave empty when dispatching on a v* tag."
        required: false
        default: ""
      require_promotion:
        description: "On a final v* tag: fail instead of rebuilding when an app's release candidate cannot be promoted (no rc, different git tree, unverified signature)."
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # Only the paths that enter the build context (see .dockerignore) can
    # change the image, so doc-only PRs skip the four builds.
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      - packages/**
      - .github/workflows/image-build.yml

permissions:
  contents: read

env:
  REGISTRY_IMAGE_PREFIX: quay.io/tutors-sdk/tutors-

jobs:
  # Pull requests: prove the image still builds and passes the Trivy gate.
  # No registry login, no OIDC token, nothing leaves the runner.
  scan:
    name: Build and scan ${{ matrix.app }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Dockerfile uses BuildKit cache mounts for the pnpm store, which
      # need the buildx container driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The cache scope is per app: the four builds share the deps stage but
      # would otherwise overwrite one another's cache entry.
      - name: Build (linux/amd64, loaded for the scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
            VERSION=pr-${{ github.event.pull_request.number }}
          push: false
          load: true
          tags: tutors-${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutors-${{ matrix.app }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Pushes to main, rc/** and v* tags, and dispatches on a v* tag: scan, publish multi-arch, sign, attest.
  publish:
    name: Publish ${{ matrix.app }}
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''))
    runs-on: ubuntu-latest
    # The arm64 half is built under QEMU emulation, which is slow.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # keyless cosign signing (Fulcio certificate from the GitHub OIDC token)
    concurrency:
      group: image-${{ github.ref }}-${{ inputs.release_tag }}-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      # The git ref being built: the event's own ref, or on a backfill the
      # release tag named in the input, which must already exist.
      - name: Resolve the ref to build
        id: what
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "backfill=false" >> "$GITHUB_OUTPUT"
            # A final tag (vX.Y.Z, no prerelease suffix) promotes its release candidate's image.
            if printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "final=true" >> "$GITHUB_OUTPUT"
            else
              echo "final=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A backfill runs from main (got $GITHUB_REF)."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag must be a release tag vX.Y.Z (got '$RELEASE_TAG')."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "::error::Tag $RELEASE_TAG does not exist."
            exit 1
          fi
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "backfill=true" >> "$GITHUB_OUTPUT"
          echo "final=false" >> "$GITHUB_OUTPUT"
          echo "Backfill of \`$RELEASE_TAG\` from main" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.what.outputs.ref }}
          persist-credentials: false

      # Promotion path, final vX.Y.Z tags only. Node 24 runs the TypeScript
      # script directly and it imports only Node built-ins, so nothing is
      # installed on a job that holds the registry credentials.
      - name: Set up Node.js (promotion script)
        if: steps.what.outputs.final == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install cosign (promotion checks)
        if: steps.what.outputs.final == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Read-only: looks up the highest X.Y.Z-rc.N in the registry, compares its
      # git tree with this tag's, checks the image's revision label and its
      # cosign signature. Prints promoted=true|false and, for false, why. With
      # require_promotion a false is a failure and nothing below runs.
      - name: Decide whether to promote the release candidate
        id: plan
        if: steps.what.outputs.final == 'true'
        env:
          APP: ${{ matrix.app }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REQUIRE_PROMOTION: ${{ inputs.require_promotion }}
        run: |
          require=""
          if [ "$REQUIRE_PROMOTION" = "true" ]; then require="--require-promotion"; fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/promote-image.ts plan --app "$APP" --ref "$REF" --sha "$SHA" $require

      # The gate is not weaker for a promoted image: the same scan runs against
      # the exact digest that is about to be released, before any tag moves. A
      # vulnerability with a fix published since the candidate was scanned stops
      # the release; the fix is a new candidate, which the harness judges again.
      - name: Run Trivy vulnerability scan (promoted digest)
        if: steps.plan.outputs.promoted == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.plan.outputs.image }}@${{ steps.plan.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login to Quay.io (promotion)
        if: steps.plan.outputs.promoted == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Retags the judged digest as X.Y.Z, X.Y, latest and sha-<short> without
      # building, then checks every tag resolves to that digest and that the
      # cosign signature and SBOM attestation verify on X.Y.Z. X.Y and latest
      # move last, only after X.Y.Z has verified.
      - name: Promote the release candidate's image
        if: steps.plan.outputs.promoted == 'true'
        env:
          APP: ${{ matrix.app }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RC: ${{ steps.plan.outputs.rc }}
          DIGEST: ${{ steps.plan.outputs.digest }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/promote-image.ts apply --app "$APP" --ref "$REF" --sha "$SHA" --rc "$RC" --digest "$DIGEST"

      # Everything from here to the end builds from source. A promoted app
      # skips all of it (see the `if` on each step).
      - name: Set up QEMU (arm64 emulation)
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # The Dockerfile uses BuildKit cache mounts for the pnpm store, which
      # need the buildx container driver; so does a multi-platform build.
      - name: Set up Docker Buildx
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # latest is handled by the explicit raw rule below (release tags only,
      # never a backfill), so the action's automatic latest is switched off.
      # A backfill reads the ref and sha from the checked-out tag (context
      # git) instead of the event, which ran on main. The semver rules
      # only fire on v* tags; for a prerelease such as v16.3.0-rc.1 the
      # metadata action emits {{version}} (16.3.0-rc.1) and skips
      # {{major}}.{{minor}}. sha-<short> outranks the branch tags so that
      # steps.meta.outputs.version is the semver on a tag and sha-<short>
      # everywhere else; that value becomes the VERSION build arg and the
      # org.opencontainers.image.version label.
      - name: Extract metadata (tags, labels)
        id: meta
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          context: ${{ steps.what.outputs.backfill == 'true' && 'git' || 'workflow' }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.what.outputs.backfill != 'true' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short,priority=650
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/rc/') }}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=tutors-${{ matrix.app }}
            org.opencontainers.image.licenses=MIT

      # The commit time, not the build time: the Dockerfile (#282) pins the
      # mtimes of the served files to it, so two builds of one commit answer
      # the same ETag and Last-Modified. Unused until that lands.
      - name: Commit time for reproducible file times
        id: epoch
        if: steps.plan.outputs.promoted != 'true'
        run: |
          echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A backfill must publish exactly the tag it was asked for; stop before
      # building if the git context resolved anything else.
      - name: Check the backfill's version
        if: steps.what.outputs.backfill == 'true' && steps.plan.outputs.promoted != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$VERSION" != "${RELEASE_TAG#v}" ]; then
            echo "::error::Resolved version '$VERSION' does not match $RELEASE_TAG."
            exit 1
          fi

      # Gate first: build the amd64 image into the local daemon and scan it.
      # Nothing has been pushed at this point, so a failing scan publishes
      # nothing. BUILD_DATE changes on every run, which deliberately busts
      # the cache of the runtime stage's `apt-get upgrade` layer so each
      # published image picks up current Debian security fixes.
      - name: Build (linux/amd64, loaded for the scan)
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ steps.epoch.outputs.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          push: false
          load: true
          tags: tutors-${{ matrix.app }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scan
        if: steps.plan.outputs.promoted != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutors-${{ matrix.app }}:scan
          format: table
          exit-code: ${{ steps.what.outputs.backfill == 'true' && '0' || '1' }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login to Quay.io
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Same builder, same inputs: the amd64 layers scanned above are reused
      # as-is and only arm64 is built fresh.
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        if: steps.plan.outputs.promoted != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ steps.epoch.outputs.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Install cosign
        if: steps.plan.outputs.promoted != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the digest, never a tag: every tag pushed above resolves to this
      # one multi-arch index, so one signature covers them all.
      - name: Sign the pushed digest (keyless)
        if: steps.plan.outputs.promoted != 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # syft resolves a multi-arch index to linux/amd64, so the SBOM lists
      # the amd64 image's packages; arm64 is built from the same lockfile
      # and Debian release.
      - name: Generate SBOM (SPDX JSON)
        if: steps.plan.outputs.promoted != 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
          artifact-name: sbom-${{ matrix.app }}.spdx.json
          upload-release-assets: false

      - name: Attest the SBOM to the pushed digest
        if: steps.plan.outputs.promoted != 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.app }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      - name: Summary
        if: steps.plan.outputs.promoted != 'true'
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: ${DIGEST}"
            echo
            echo "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
