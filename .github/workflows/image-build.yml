name: Container Image Build

# Builds the four Tutors app images from the root Dockerfile
# (--build-arg APP_NAME=<app>, see deploy/README.md) and publishes them to
# quay.io/tutors-sdk/tutors-<app>.
#
#   pull_request            linux/amd64 build and Trivy scan only, nothing is pushed
#   push to main            push  sha-<short>  and  main
#   push to rc/**           push  sha-<short>  and the branch name with "/" as "-"
#                           (rc/16.2.0 becomes rc-16.2.0)
#   push tag vX.Y.Z         push  X.Y.Z, X.Y, latest  and  sha-<short>
#   push tag vX.Y.Z-rc.N    push  X.Y.Z-rc.N  and  sha-<short>  only; a
#                           prerelease never moves X.Y or latest
#
# Published images are linux/amd64 + linux/arm64. The amd64 image is scanned
# with Trivy before anything is pushed; CRITICAL and HIGH findings with an
# available fix stop the workflow. The pushed digest is then signed with
# cosign (keyless, GitHub OIDC) and carries an SPDX SBOM attestation. The
# release harness verifies both, see "Verifying an image" in deploy/README.md.

on:
  push:
    branches: [main, "rc/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Only the paths that enter the build context (see .dockerignore) can
    # change the image, so doc-only PRs skip the four builds.
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/**
      - packages/**
      - .github/workflows/image-build.yml

permissions:
  contents: read

env:
  REGISTRY_IMAGE_PREFIX: quay.io/tutors-sdk/tutors-

jobs:
  # Pull requests: prove the image still builds and passes the Trivy gate.
  # No registry login, no OIDC token, nothing leaves the runner.
  scan:
    name: Build and scan ${{ matrix.app }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The Dockerfile uses BuildKit cache mounts for the pnpm store, which
      # need the buildx container driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The cache scope is per app: the four builds share the deps stage but
      # would otherwise overwrite one another's cache entry.
      - name: Build (linux/amd64, loaded for the scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
            VERSION=pr-${{ github.event.pull_request.number }}
          push: false
          load: true
          tags: tutors-${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutors-${{ matrix.app }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Pushes to main, rc/** and v* tags: scan, publish multi-arch, sign, attest.
  publish:
    name: Publish ${{ matrix.app }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The arm64 half is built under QEMU emulation, which is slow.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # keyless cosign signing (Fulcio certificate from the GitHub OIDC token)
    concurrency:
      group: image-${{ github.ref }}-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # The Dockerfile uses BuildKit cache mounts for the pnpm store, which
      # need the buildx container driver; so does a multi-platform build.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # latest is handled by the explicit raw rule below (release tags only),
      # so the action's automatic latest is switched off. The semver rules
      # only fire on v* tags; for a prerelease such as v16.3.0-rc.1 the
      # metadata action emits {{version}} (16.3.0-rc.1) and skips
      # {{major}}.{{minor}}. sha-<short> outranks the branch tags so that
      # steps.meta.outputs.version is the semver on a tag and sha-<short>
      # everywhere else; that value becomes the VERSION build arg and the
      # org.opencontainers.image.version label.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short,priority=650
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/rc/') }}
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=tutors-${{ matrix.app }}
            org.opencontainers.image.licenses=MIT

      # Gate first: build the amd64 image into the local daemon and scan it.
      # Nothing has been pushed at this point, so a failing scan publishes
      # nothing. BUILD_DATE changes on every run, which deliberately busts
      # the cache of the runtime stage's `apt-get upgrade` layer so each
      # published image picks up current Debian security fixes.
      - name: Build (linux/amd64, loaded for the scan)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
          push: false
          load: true
          tags: tutors-${{ matrix.app }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tutors-${{ matrix.app }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Same builder, same inputs: the amd64 layers scanned above are reused
      # as-is and only arm64 is built fresh.
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_NAME=${{ matrix.app }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the digest, never a tag: every tag pushed above resolves to this
      # one multi-arch index, so one signature covers them all.
      - name: Sign the pushed digest (keyless)
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # syft resolves a multi-arch index to linux/amd64, so the SBOM lists
      # the amd64 image's packages; arm64 is built from the same lockfile
      # and Debian release.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.app }}.spdx.json
          artifact-name: sbom-${{ matrix.app }}.spdx.json
          upload-release-assets: false

      - name: Attest the SBOM to the pushed digest
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.app }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE_PREFIX }}${{ matrix.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: ${DIGEST}"
            echo
            echo "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
