name: Scorecard

# OpenSSF Scorecard: automated supply-chain security posture analysis.
# Runs weekly and on pushes to main, publishes results to the OpenSSF
# public dashboard, and uploads SARIF to GitHub code scanning.
# Docs: https://github.com/ossf/scorecard-action

on:
  # Re-run whenever branch protection settings change so the
  # Branch-Protection check reflects the current configuration.
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1" # Mondays 07:20 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (OIDC token for publish_results).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Read-only PAT (fine-grained: administration:read + metadata:read).
          # Without it the Branch-Protection check cannot read protection
          # settings and scores 0. Falls back to GITHUB_TOKEN when unset.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Publish to the public OpenSSF dashboard + enable the badge.
          # Only publishes on the default branch of the upstream repo.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
