name: Release Claims

# A release branch carries release/claims.yaml, the list of differences the
# release intends, which release-dispatch.yml hands to the release harness.
# This fails the push or the release PR when the file is missing or is not a
# claims file the harness would accept (scripts/checks/release-claims.ts).

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    name: release/claims.yaml is valid
    # Release PRs only; on any other PR the committed file is covered by
    # tests/conformance/release-claims.test.ts in CI.
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: this runs on release branches, and a cache written
      # there should not be trusted by anything that publishes.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      # The check needs tsx and js-yaml from the root package only.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .

      - name: Check release/claims.yaml
        run: pnpm check:release-claims
