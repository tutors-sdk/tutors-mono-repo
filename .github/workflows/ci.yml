name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for SvelteKit apps
        run: |
          for dir in apps/reader apps/catalogue apps/live apps/time; do
            if [ -d "$dir" ]; then
              cp .env.example "$dir/.env"
            fi
          done

      - name: Build all packages and apps
        run: pnpm build

      - name: Check API surface reports
        run: pnpm api-report:check

      # TODO: 138 pre-existing type errors need fixing — see issue #53
      - name: Type check (reader)
        run: pnpm --filter tutors-reader check
        continue-on-error: true

      - name: Type check (catalogue)
        run: pnpm --filter tutors-catalogue check
        continue-on-error: true

      - name: Type check (live)
        run: pnpm --filter tutors-live check
        continue-on-error: true

      - name: Run unit tests
        run: pnpm exec vitest run --coverage

      - name: Run fuzz tests
        run: pnpm test:fuzz
