name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for SvelteKit apps
        run: cp .env.example .env

      # Generates each app's .svelte-kit/tsconfig.json, which the app tsconfigs extend.
      # Tests import app source files (e.g. legacy hooks), so every app must be synced,
      # not only the ones that get type-checked below.
      - name: Sync SvelteKit apps
        run: pnpm -r --filter "./apps/**" exec svelte-kit sync

      - name: Build all packages and apps
        run: pnpm build

      - name: Check API surface reports
        run: pnpm api-report:check

      # TODO: 138 pre-existing type errors need fixing — see issue #53
      - name: Type check (reader)
        run: pnpm --filter tutors-reader check
        continue-on-error: true

      - name: Type check (catalogue)
        run: pnpm --filter tutors-catalogue check
        continue-on-error: true

      - name: Type check (live)
        run: pnpm --filter tutors-live check
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm exec vitest run --coverage

      - name: Run fuzz tests
        run: pnpm test:fuzz
