name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for SvelteKit apps
        run: |
          for dir in apps/reader apps/catalogue apps/live apps/time; do
            if [ -d "$dir" ]; then
              cp .env.example "$dir/.env"
            fi
          done

      # Generates each app's .svelte-kit/tsconfig.json, which the app tsconfigs extend.
      # Tests import app source files (e.g. legacy hooks), so every app must be synced,
      # not only the ones that get type-checked below.
      - name: Sync SvelteKit apps
        run: pnpm -r --filter "./apps/**" exec svelte-kit sync

      - name: Build all packages and apps
        run: pnpm build

      - name: Check API surface reports
        run: pnpm api-report:check

      # TODO: 138 pre-existing type errors need fixing — see issue #53
      - name: Type check (reader)
        run: pnpm --filter tutors-reader check
        continue-on-error: true

      - name: Type check (catalogue)
        run: pnpm --filter tutors-catalogue check
        continue-on-error: true

      - name: Type check (live)
        run: pnpm --filter tutors-live check
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      # Runway tier A: unused files, exports and dependencies, ratcheted
      # against tests/architecture/known-knip.txt.
      - name: Unused code and dependencies (knip)
        run: pnpm check:knip

      - name: Run unit tests
        run: pnpm exec vitest run --coverage

      - name: Run fuzz tests
        run: pnpm test:fuzz

  # Testing runway tier J: the manifests render, validate against the
  # Kubernetes schemas and satisfy the restricted-SCC policies in
  # scripts/checks/conformance.ts. The policy unit tests and the config
  # completeness check run with the rest of Vitest above.
  platform-conformance:
    name: Platform conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render overlays and check policies
        run: pnpm check:k8s --out rendered

      - name: Validate rendered manifests against Kubernetes schemas
        run: >
          docker run --rm -v "$PWD:/work:ro" -w /work
          ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.33.0 rendered

      - name: Schema validation rejects an invalid manifest (negative fixture)
        run: |
          if docker run --rm -v "$PWD:/work:ro" -w /work \
            ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -kubernetes-version 1.33.0 tests/conformance/fixtures/invalid-manifest.yaml; then
            echo "::error::kubeconform accepted tests/conformance/fixtures/invalid-manifest.yaml"
            exit 1
          fi

  # Testing runway tiers J and K against the built image: arbitrary UID,
  # read-only root, .env.example values only; healthz, metrics and log contract.
  container-smoke:
    name: Container smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [reader, catalogue, live, time]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          build-args: APP_NAME=${{ matrix.app }}
          tags: tutors/${{ matrix.app }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=smoke-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.app }}

      - name: Smoke test the image
        run: pnpm check:container --image "tutors/${MATRIX_APP}:ci"
        env:
          MATRIX_APP: ${{ matrix.app }}

  container-smoke-fixtures:
    name: Container smoke negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build fixture image
        run: docker build -t tutors-smoke-fixture tests/conformance/fixtures/faulty-image

      - name: Healthy fixture passes
        run: pnpm check:container --image tutors-smoke-fixture

      - name: Fixture that writes to its root filesystem fails
        run: pnpm check:container --image tutors-smoke-fixture --env FIXTURE_FAULT=readonly --startup-budget-ms 10000 --expect-fail

      - name: Fixture that needs UID 1001 fails
        run: pnpm check:container --image tutors-smoke-fixture --env FIXTURE_FAULT=uid --startup-budget-ms 10000 --expect-fail

  # The one check to mark as required in branch protection. A skipped or
  # cancelled job counts as a failure.
  ci-success:
    name: CI success
    if: always()
    needs: [build-and-test, platform-conformance, container-smoke, container-smoke-fixtures]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result' (results: $RESULTS)"
              exit 1
            fi
          done
