version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
      # TypeScript 7 (the native compiler) has no JS API yet: svelte2tsx refuses it
      # ("emitDts is not compatible with TypeScript 7"), so svelte-package and svelte-check
      # cannot run. Lift this once the Svelte tooling supports 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Security updates are grouped per ecosystem, outside the weekly batch.
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # The Node base image is pinned by digest in the Dockerfile (Rule 0667), so a
  # new Node or Debian build reaches the images only through this pull request,
  # on its own, where its CHANGELOG hint (sbom, image-manifest) declares it.
  # No patch ignore: Node patch releases and Debian fixes are what it carries.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker"
