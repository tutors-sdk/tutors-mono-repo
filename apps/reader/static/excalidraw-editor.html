<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw Editor</title>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    #loading {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #666;
      background: #fff;
    }
    #loading.hidden { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Loading editor...</div>
  <div id="root"></div>
  <script type="module">
    import React, { createElement, useEffect, useRef, useState, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom";
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const CURSOR_COLORS = [
      "#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4",
      "#FFEAA7", "#DDA0DD", "#98D8C8", "#F7DC6F",
    ];

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    const loadingEl = document.getElementById("loading");
    const BROADCAST_CONFIG = { config: { broadcast: { self: false }, presence: { key: "" } } };

    function ExcalidrawEditor({ config }) {
      const excalidrawAPIRef = useRef(null);
      const channelRef = useRef(null);
      const collaboratorsRef = useRef(new Map());
      const lastVersionsRef = useRef(new Map());
      const isRemoteUpdateRef = useRef(false);
      const debounceTimerRef = useRef(null);
      const [collaborators, setCollaborators] = useState(new Map());

      useEffect(() => {
        const supabase = createClient(config.supabaseUrl, config.supabaseAnonKey);
        const myColor = CURSOR_COLORS[hashCode(config.user.id) % CURSOR_COLORS.length];
        const channelName = `wb:${config.roomId}`;

        const channel = supabase.channel(channelName, BROADCAST_CONFIG);
        channelRef.current = channel;

        channel
          .on("broadcast", { event: "scene-update" }, ({ payload }) => {
            const api = excalidrawAPIRef.current;
            if (!api || !payload) return;

            const currentElements = api.getSceneElements();
            const elementMap = new Map(currentElements.map(el => [el.id, el]));

            for (const el of payload.elements) {
              const existing = elementMap.get(el.id);
              if (!existing || el.version >= existing.version) {
                elementMap.set(el.id, el);
              }
            }

            isRemoteUpdateRef.current = true;
            api.updateScene({ elements: Array.from(elementMap.values()) });
            isRemoteUpdateRef.current = false;

            for (const el of payload.elements) {
              lastVersionsRef.current.set(el.id, el.version);
            }
          })
          .on("broadcast", { event: "cursor-update" }, ({ payload }) => {
            if (!payload) return;
            const collabs = new Map(collaboratorsRef.current);
            collabs.set(payload.userId, {
              pointer: payload.pointer,
              button: payload.button,
              username: payload.userName || "Anonymous",
              color: { background: payload.color || "#ccc", stroke: payload.color || "#ccc" },
            });
            collaboratorsRef.current = collabs;
            setCollaborators(new Map(collabs));
          })
          .on("presence", { event: "sync" }, () => {
            const state = channel.presenceState();
            const activeUserIds = new Set();
            for (const [, presences] of Object.entries(state)) {
              for (const p of presences) {
                activeUserIds.add(p.userId);
              }
            }
            const collabs = new Map(collaboratorsRef.current);
            for (const userId of collabs.keys()) {
              if (!activeUserIds.has(userId)) {
                collabs.delete(userId);
              }
            }
            collaboratorsRef.current = collabs;
            setCollaborators(new Map(collabs));
          })
          .subscribe(async (status) => {
            if (status === "SUBSCRIBED") {
              await channel.track({
                userId: config.user.id,
                userName: config.user.name,
                avatar: config.user.avatar,
                color: myColor,
              });

              if (config.initialScene) {
                const api = excalidrawAPIRef.current;
                if (api) {
                  const versionMap = lastVersionsRef.current;
                  for (const el of config.initialScene.elements || []) {
                    versionMap.set(el.id, el.version);
                  }
                }
              }
            }
          });

        return () => {
          channel.unsubscribe();
        };
      }, [config]);

      const handleChange = useCallback((elements) => {
        if (isRemoteUpdateRef.current) return;

        if (debounceTimerRef.current) {
          clearTimeout(debounceTimerRef.current);
        }

        debounceTimerRef.current = setTimeout(() => {
          const channel = channelRef.current;
          if (!channel) return;

          const versionMap = lastVersionsRef.current;
          const changed = elements.filter(el => {
            const lastVersion = versionMap.get(el.id);
            return lastVersion === undefined || el.version > lastVersion;
          });

          if (changed.length === 0) return;

          for (const el of changed) {
            versionMap.set(el.id, el.version);
          }

          channel.send({
            type: "broadcast",
            event: "scene-update",
            payload: { elements: changed },
          });

          window.parent.postMessage({
            type: "scene-changed",
            elements: elements,
          }, "*");
        }, 100);
      }, []);

      const handlePointerUpdate = useCallback((payload) => {
        const channel = channelRef.current;
        if (!channel) return;

        const myColor = CURSOR_COLORS[hashCode(config.user.id) % CURSOR_COLORS.length];
        channel.send({
          type: "broadcast",
          event: "cursor-update",
          payload: {
            userId: config.user.id,
            userName: config.user.name,
            color: myColor,
            pointer: payload.pointer,
            button: payload.button,
          },
        });
      }, [config.user]);

      return createElement(Excalidraw, {
        excalidrawAPI: (api) => { excalidrawAPIRef.current = api; },
        onChange: handleChange,
        onPointerUpdate: handlePointerUpdate,
        isCollaborating: true,
        initialData: config.initialScene ? {
          elements: config.initialScene.elements || [],
          appState: {
            viewBackgroundColor:
              config.initialScene.appState?.viewBackgroundColor || "#ffffff",
          },
          files: config.initialScene.files || {},
        } : undefined,
      });
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type === "init-editor") {
        loadingEl.classList.add("hidden");

        const root = createRoot(document.getElementById("root"));
        root.render(createElement(ExcalidrawEditor, { config: event.data }));
      }
    });

    window.parent.postMessage({ type: "editor-ready" }, "*");
  </script>
</body>
</html>
