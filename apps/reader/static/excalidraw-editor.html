<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw Editor</title>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    #loading {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; color: #666;
      background: #fff;
    }
    #loading.hidden { display: none; }
    /* Excalidraw's own dark canvas colour, while the editor loads in dark mode. */
    body.dark #loading { background: #121212; color: #a0a0a0; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Loading editor...</div>
  <div id="root"></div>
  <script type="module">
    import React, { createElement, useEffect, useRef, useState, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom";
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.117.2";

    const CURSOR_COLORS = [
      "#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4",
      "#FFEAA7", "#DDA0DD", "#98D8C8", "#F7DC6F",
    ];

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    const loadingEl = document.getElementById("loading");

    // The same Realtime budget as the reader's gateway (@tutors/realtime), which this page cannot import:
    // a server-side event cap, and full-jitter reconnects so tabs do not all return at once after an outage.
    const REALTIME_OPTIONS = {
      params: { eventsPerSecond: 10 },
      reconnectAfterMs: (tries) => Math.round(Math.random() * Math.min(30000, 1000 * 2 ** Math.max(0, tries - 1))),
    };

    // Every broadcast is billed once per receiver, so a room's cursor traffic grows with the square of its size.
    // Larger rooms share cursors less often, and above 8 participants only Presence shows who is there.
    const SCENE_BATCH_MS = 250;
    const CURSOR_MIN_MOVE_PX = 4;
    function cursorInterval(participants) {
      if (participants <= 3) return 100;
      if (participants <= 6) return 250;
      if (participants <= 8) return 500;
      return null;
    }

    function ExcalidrawEditor({ config }) {
      const excalidrawAPIRef = useRef(null);
      const channelRef = useRef(null);
      const collaboratorsRef = useRef(new Map());
      const lastVersionsRef = useRef(new Map());
      const pendingSceneRef = useRef(new Map());
      const isRemoteUpdateRef = useRef(false);
      const debounceTimerRef = useRef(null);
      const cursorTimerRef = useRef(null);
      const pendingCursorRef = useRef(null);
      const subscribedRef = useRef(false);
      const hasPeersRef = useRef(true);
      const participantsRef = useRef(2);
      const latestElementsRef = useRef(null);
      const lastCursorRef = useRef(null);
      const cursorArmedAtRef = useRef(0);
      const [collaborators, setCollaborators] = useState(new Map());
      // The reader's appearance: set by init-editor, then followed through "set-theme" messages.
      const [theme, setTheme] = useState(config.theme === "dark" ? "dark" : "light");
      useEffect(() => {
        const onTheme = (event) => {
          if (event.origin !== location.origin || event.data?.type !== "set-theme") return;
          const next = event.data.theme === "dark" ? "dark" : "light";
          document.body.classList.toggle("dark", next === "dark");
          setTheme(next);
        };
        window.addEventListener("message", onTheme);
        return () => window.removeEventListener("message", onTheme);
      }, []);

      useEffect(() => {
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          return () => clearTimeout(debounceTimerRef.current);
        }
        const supabase = createClient(config.supabaseUrl, config.supabaseAnonKey, { realtime: REALTIME_OPTIONS });
        const myColor = CURSOR_COLORS[hashCode(config.user.id) % CURSOR_COLORS.length];
        const channelName = `wb:${config.roomId}`;

        const presenceKey = crypto.randomUUID();
        const channel = supabase.channel(channelName, {
          config: { broadcast: { self: false }, presence: { key: presenceKey } },
        });
        channelRef.current = channel;

        channel
          .on("broadcast", { event: "scene-update" }, ({ payload }) => {
            const api = excalidrawAPIRef.current;
            if (!api || !payload) return;

            const currentElements = api.getSceneElements();
            const elementMap = new Map(currentElements.map(el => [el.id, el]));

            for (const el of payload.elements) {
              const existing = elementMap.get(el.id);
              if (!existing || el.version >= existing.version) {
                elementMap.set(el.id, el);
              }
            }

            isRemoteUpdateRef.current = true;
            api.updateScene({ elements: Array.from(elementMap.values()) });
            isRemoteUpdateRef.current = false;

            for (const el of payload.elements) {
              lastVersionsRef.current.set(el.id, el.version);
            }
          })
          .on("broadcast", { event: "cursor-update" }, ({ payload }) => {
            if (!payload) return;
            const collabs = new Map(collaboratorsRef.current);
            collabs.set(payload.userId, {
              pointer: payload.pointer,
              button: payload.button,
              username: payload.userName || "Anonymous",
              color: { background: payload.color || "#ccc", stroke: payload.color || "#ccc" },
            });
            collaboratorsRef.current = collabs;
            setCollaborators(new Map(collabs));
          })
          .on("presence", { event: "sync" }, () => {
            const state = channel.presenceState();
            hasPeersRef.current = Object.keys(state).some(key => key !== presenceKey);
            participantsRef.current = Math.max(Object.keys(state).length, 1);
            // A queued cursor keeps to the interval of the room it is now in, not the one it was queued in.
            if (cursorTimerRef.current !== null) {
              clearTimeout(cursorTimerRef.current);
              cursorTimerRef.current = null;
              const interval = cursorInterval(participantsRef.current);
              if (interval !== null) {
                cursorTimerRef.current = setTimeout(sendQueuedCursor, Math.max(0, cursorArmedAtRef.current + interval - Date.now()));
              }
            }
            // Presence can lag behind subscription, so replay edits suppressed while alone.
            if (hasPeersRef.current && pendingSceneRef.current.size > 0) {
              channel.send({
                type: "broadcast",
                event: "scene-update",
                payload: { elements: Array.from(pendingSceneRef.current.values()) },
              });
              pendingSceneRef.current.clear();
            }
            const activeUserIds = new Set();
            for (const [, presences] of Object.entries(state)) {
              for (const p of presences) {
                activeUserIds.add(p.userId);
              }
            }
            const collabs = new Map(collaboratorsRef.current);
            for (const userId of collabs.keys()) {
              if (!activeUserIds.has(userId)) {
                collabs.delete(userId);
              }
            }
            collaboratorsRef.current = collabs;
            setCollaborators(new Map(collabs));
          })
          .subscribe(async (status) => {
            subscribedRef.current = status === "SUBSCRIBED";
            if (status === "SUBSCRIBED") {
              await channel.track({
                userId: config.user.id,
                userName: config.user.name,
                avatar: config.user.avatar,
                color: myColor,
              });

              if (config.initialScene) {
                const api = excalidrawAPIRef.current;
                if (api) {
                  const versionMap = lastVersionsRef.current;
                  for (const el of config.initialScene.elements || []) {
                    versionMap.set(el.id, el.version);
                  }
                }
              }
            }
          });

        return () => {
          clearTimeout(debounceTimerRef.current);
          clearTimeout(cursorTimerRef.current);
          debounceTimerRef.current = null;
          cursorTimerRef.current = null;
          pendingCursorRef.current = null;
          latestElementsRef.current = null;
          pendingSceneRef.current.clear();
          subscribedRef.current = false;
          hasPeersRef.current = false;
          channelRef.current = null;
          void supabase.removeChannel(channel);
        };
      }, [config]);

      const handleChange = useCallback((elements) => {
        if (isRemoteUpdateRef.current) return;

        // Batch rather than debounce: a long drag still reaches peers, at most 4 times a second.
        latestElementsRef.current = elements;
        if (debounceTimerRef.current !== null) return;

        debounceTimerRef.current = setTimeout(() => {
          debounceTimerRef.current = null;
          const elements = latestElementsRef.current;
          latestElementsRef.current = null;
          const channel = channelRef.current;
          if (!elements) return;

          const versionMap = lastVersionsRef.current;
          const changed = elements.filter(el => {
            const lastVersion = versionMap.get(el.id);
            return lastVersion === undefined || el.version > lastVersion;
          });

          if (changed.length === 0) return;

          for (const el of changed) {
            versionMap.set(el.id, el.version);
          }

          if (channel && hasPeersRef.current) {
            channel.send({
              type: "broadcast",
              event: "scene-update",
              payload: { elements: changed },
            });
          } else if (channel) {
            for (const el of changed) pendingSceneRef.current.set(el.id, el);
          }

          window.parent.postMessage({
            type: "scene-changed",
            elements: elements,
          }, location.origin);
        }, SCENE_BATCH_MS);
      }, []);

      function sendQueuedCursor() {
        cursorTimerRef.current = null;
        const channel = channelRef.current;
        if (!channel || !subscribedRef.current || !hasPeersRef.current) return;
        if (cursorInterval(participantsRef.current) === null) return;
        const next = pendingCursorRef.current;
        const last = lastCursorRef.current;
        if (last && next.button === last.button &&
            Math.hypot(next.pointer.x - last.pointer.x, next.pointer.y - last.pointer.y) < CURSOR_MIN_MOVE_PX) return;
        lastCursorRef.current = next;
        const myColor = CURSOR_COLORS[hashCode(config.user.id) % CURSOR_COLORS.length];
        channel.send({
          type: "broadcast",
          event: "cursor-update",
          payload: {
            userId: config.user.id,
            userName: config.user.name,
            color: myColor,
            ...next,
          },
        });
      }

      const handlePointerUpdate = useCallback((payload) => {
        if (!channelRef.current || !subscribedRef.current || !hasPeersRef.current) return;
        const interval = cursorInterval(participantsRef.current);
        if (interval === null) return;
        pendingCursorRef.current = { pointer: payload.pointer, button: payload.button };
        if (cursorTimerRef.current !== null) return;

        // Coalesce pointer events to one broadcast per interval, keeping the final position.
        cursorArmedAtRef.current = Date.now();
        cursorTimerRef.current = setTimeout(sendQueuedCursor, interval);
      }, [config.user]);

      return createElement(Excalidraw, {
        excalidrawAPI: (api) => { excalidrawAPIRef.current = api; },
        onChange: handleChange,
        onPointerUpdate: handlePointerUpdate,
        isCollaborating: true,
        theme,
        initialData: config.initialScene ? {
          elements: config.initialScene.elements || [],
          appState: {
            viewBackgroundColor:
              config.initialScene.appState?.viewBackgroundColor || "#ffffff",
          },
          files: config.initialScene.files || {},
        } : undefined,
      });
    }

    // Only the reader that embeds this page (same origin) may drive it.
    window.addEventListener("message", (event) => {
      if (event.origin !== location.origin) return;
      if (event.data?.type === "init-editor") {
        document.body.classList.toggle("dark", event.data.theme === "dark");
        loadingEl.classList.add("hidden");

        const root = createRoot(document.getElementById("root"));
        root.render(createElement(ExcalidrawEditor, { config: event.data }));
      }
    });

    window.parent.postMessage({ type: "editor-ready" }, location.origin);
  </script>
</body>
</html>
