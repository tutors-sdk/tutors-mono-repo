<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from "https://esm.sh/react@19.1.0";
    import { createRoot } from "https://esm.sh/react-dom@19.1.0/client";
    import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom";

    const root = createRoot(document.getElementById("root"));

    function Viewer({ sceneData }) {
      return React.createElement(Excalidraw, {
        initialData: sceneData,
        viewModeEnabled: true,
        zenModeEnabled: true,
        gridModeEnabled: false,
        theme: "light",
        UIOptions: {
          canvasActions: {
            changeViewBackgroundColor: false,
            clearCanvas: false,
            export: false,
            loadScene: false,
            saveToActiveFile: false,
            toggleTheme: false,
          },
        },
      });
    }

    window.addEventListener("message", (event) => {
      if (event.data?.type === "load-scene") {
        root.render(React.createElement(Viewer, { sceneData: event.data.scene }));
      }
    });

    window.parent.postMessage({ type: "viewer-ready" }, "*");
  </script>
</body>
</html>
