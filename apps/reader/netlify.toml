# check:env fails a production build that lacks a variable this app needs (Rule 0686), so Netlify keeps
# serving the previous deploy. It reads the site's environment variables, so give them the Builds scope.
[build]
  base = "/"
  command = "pnpm install --frozen-lockfile && pnpm check:env --app reader && pnpm --filter tutors-reader... build"

[build.environment]
  NODE_VERSION = "26.13.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://esm.sh; img-src 'self' data: https:; font-src 'self' data: https://esm.sh; connect-src 'self' https://esm.sh https://*.supabase.co wss://*.supabase.co; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
