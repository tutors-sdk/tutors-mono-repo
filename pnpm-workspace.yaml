packages:
  - "packages/jsr/*"
  - "packages/svelte/*"
  - "packages/svelte/utils/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  msw: true
  workerd: true
minimumReleaseAgeExclude:
  - '@skeletonlabs/skeleton-common@5.0.1'
  - '@skeletonlabs/skeleton-svelte@5.0.1'
  - '@skeletonlabs/skeleton@5.0.1'
  - dompurify@3.4.14
  - happy-dom@20.11.6
  - vite@8.2.2
# Better Auth 1.7.7 publishes a Kit 2 peer; the built-session/browser contracts cover this exact Kit 3 pairing.
peerDependencyRules:
  allowedVersions:
    "better-auth@1.7.7>@sveltejs/kit": "3.0.1"
overrides:
  cookie@<0.7.0: ">=0.7.0 <1.0.0"
  # Security advisory remediation. Ranges are bounded to the same major so
  # consumers pinned to a major (e.g. packages/jsr/gen -> npm:js-yaml@^4.1.1)
  # keep resolving.
  js-yaml@>=3.0.0 <3.15.1: ">=3.15.1 <4"
  js-yaml@>=4.0.0 <4.3.1: ">=4.3.1 <5"
  nanoid@<3.3.18: ">=3.3.18 <4"
  qs@>=6.11.1 <=6.15.1: ">=6.15.2 <7"
  "@sveltejs/kit@<=2.70.1": ">=2.70.2 <3"
  fast-uri@<3.1.9: ">=3.1.9 <4"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ">=0.9.12 <0.10"
  # GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh (mermaid > chevrotain > lodash-es).
  lodash-es@<4.18.1: ">=4.18.1 <5"
  # GHSA-9rgm-9g3h-6x36 (@sveltejs/kit > devalue).
  devalue@<5.9.1: ">=5.9.1 <6"
  brace-expansion@>=4.0.0 <5.0.12: ">=5.0.12 <6"
  # GHSA-cg2g-xh64-v4q7, GHSA-mrv2-3pqr-j5jr, GHSA-c6gr-qvv4-5v3f (reader, isomorphic-dompurify > dompurify).
  dompurify@<3.4.17: ">=3.4.17 <4"
  # GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q (marp, katex plugin > markdown-it).
  "@marp-team/marpit>markdown-it": ">=14.3.3 <15"
  markdown-it@>=15.0.0 <15.0.3: ">=15.0.3 <16"
  # GHSA-587h-7wmj-h5pm and four more (vitest > vite).
  vite@>=8.3.0 <8.3.3: ">=8.3.3 <9"
  # GHSA-xjj6-f33q-929c (Node fetch in the apps > undici).
  undici@>=8.0.0 <8.12.2: ">=8.12.2 <9"
  # GHSA-mrhx-c7xc-m3w5 (better-auth and others > zod).
  zod@>=4.0.0 <4.6.6: ">=4.6.6 <5"
  # GHSA-834v-8h66-3h79 (test runner > happy-dom, dev only).
  happy-dom@>=21.0.0 <21.0.4: ">=21.0.4 <22"
  # GHSA-68fv-2mgg-jv7q: the sanitizer runtime now includes source-map-js.
  source-map-js@>=1.0.0 <1.2.2: ">=1.2.2 <2"
  # GHSA-238p-pmpm-9mq7 (@marp-team/marp-core > katex). marp-core 5.0.2 still asks for ^0.17.0;
  # 0.18 keeps renderToString, the one call marp makes.
  katex@>=0.11.0 <0.18.2: ">=0.18.2 <0.19"
  # GHSA-rj75-hqrm-r3gf (eslint-plugin-svelte, @marp-team/marpit > postcss-selector-parser).
  postcss-selector-parser@<7.1.6: ">=7.1.6 <8"
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
