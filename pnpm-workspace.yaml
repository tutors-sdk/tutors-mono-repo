packages:
  - "packages/jsr/*"
  - "packages/svelte/*"
  - "packages/svelte/utils/*"
  - "apps/*"
  - "services/party"
allowBuilds:
  esbuild: true
  msw: true
  workerd: true
minimumReleaseAgeExclude:
  - '@skeletonlabs/skeleton-common@5.0.1'
  - '@skeletonlabs/skeleton-svelte@5.0.1'
  - '@skeletonlabs/skeleton@5.0.1'
  - dompurify@3.4.14
  - happy-dom@20.11.6
  - vite@8.2.2
overrides:
  cookie: ">=0.7.0 <1.0.0"
  js-yaml@>=3.0.0 <3.15.1: ">=3.15.1"
  js-yaml@>=4.0.0 <4.3.1: ">=4.3.1"
  nanoid@<3.3.18: ">=3.3.18"
  qs@>=6.11.1 <=6.15.1: ">=6.15.2"
  "@sveltejs/kit@<=2.70.1": ">=2.70.2"
