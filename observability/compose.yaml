# Observability stack: Prometheus scraping the four Tutors apps, and Grafana
# provisioned with that data source plus the alert rules, contact points and
# notification policy in ./grafana/provisioning.
#
# It is deliberately independent of the app stacks. Prometheus reaches the
# apps through the ports they publish on the host (3000-3003 by default), so
# the same stack works next to the local `docker compose up --build`, the
# staging stack in deploy/staging, or apps started any other way.
#
#   cd observability
#   docker compose up -d
#
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3004   (admin / admin, change on first login)
#
# Edit prometheus/prometheus.yml if the apps listen on other ports or hosts.
name: tutors-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Linux Docker Engine has no host.docker.internal by default; Docker
    # Desktop ignores this entry.
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
