# Grafana alerting rules provisioned at startup. GENERATED from release/slo.yaml by `pnpm slo:alerts`:
# edit the objectives there, never this file (`pnpm check:slo` fails when the two drift, Rule 0298).
#
# tutors-infra: the health check, which no objective covers.
# tutors-slo: per objective, multi-window burn-rate alerts for that objective's app alone (Rule 0297): page-fast
# (14.4x over 1h and 5m) and page-slow (6x over 6h and 30m) page; ticket (1x over 3d and 6h) does not. Each is labelled
# with its objective (slo) and app, and links its runbook in docs/slo.md.
apiVersion: 1
groups:
  - orgId: 1
    name: tutors-infra
    folder: Tutors
    interval: 1m
    rules:
      - uid: healthz-failing
        title: Health check failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up == 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Service health check failing
          description: "{{ $labels.app }} ({{ $labels.instance }}) has been unreachable for 2 minutes"
  - orgId: 1
    name: tutors-slo
    folder: Tutors
    interval: 1m
    rules:
      - uid: slo-reader-availability-page-fast
        title: "reader-availability: error budget burning 14.4x"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(rate(http_requests_total{app="reader",status_code=~"5.."}[1h])) / sum(rate(http_requests_total{app="reader"}[1h]))) > 0.072 and (sum(rate(http_requests_total{app="reader",status_code=~"5.."}[5m])) / sum(rate(http_requests_total{app="reader"}[5m]))) > 0.072
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: critical
          slo: reader-availability
          app: reader
        annotations:
          summary: "reader: reader-availability is burning its error budget 14.4x too fast"
          description: "Objective: 99.5% of reader responses that are not 5xx. More than 7.2% were bad over both the last 1h and the last 5m."
          runbook_url: https://github.com/tutors-sdk/tutors-mono-repo/blob/main/docs/slo.md#reader-availability
      - uid: slo-reader-availability-page-slow
        title: "reader-availability: error budget burning 6x"
