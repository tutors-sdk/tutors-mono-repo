# Staging stack: runs the four Tutors apps from the images the
# "Container Image Build" workflow publishes to quay.io/tutors-sdk.
# Nothing is built here; for a from-source stack use the root compose.yaml.
#
#   cp .env.example .env                          # fill in Supabase, OAuth, Moodle values
#   docker compose up -d
#   docker compose pull && docker compose up -d   # roll to the current IMAGE_TAG
#
# IMAGE_TAG selects what to run: latest (main), rc-<branch> (release
# candidates), X.Y.Z (releases) or sha-<short> (any main commit).
# Host ports default to 3000-3003 (READER_PORT, CATALOGUE_PORT, LIVE_PORT,
# TIME_PORT). The HTTP proxy supplies the request origin for CSRF and OAuth.
name: tutors-staging

x-app: &app
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - .env
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/healthz/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  proxy:
    image: docker.io/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries a file capability and needs it in the bounding set to execute.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:uid=1001,gid=1001
      - /config:uid=1001,gid=1001
    volumes:
      - ../local/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${READER_PORT:-3000}:3000"
      - "${CATALOGUE_PORT:-3001}:3001"
      - "${LIVE_PORT:-3002}:3002"
      - "${TIME_PORT:-3003}:3003"

  reader:
    <<: *app
    image: quay.io/tutors-sdk/tutors-reader:${IMAGE_TAG:-main}
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  catalogue:
    <<: *app
    image: quay.io/tutors-sdk/tutors-catalogue:${IMAGE_TAG:-main}
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  live:
    <<: *app
    image: quay.io/tutors-sdk/tutors-live:${IMAGE_TAG:-main}
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  time:
    <<: *app
    image: quay.io/tutors-sdk/tutors-time:${IMAGE_TAG:-main}
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
