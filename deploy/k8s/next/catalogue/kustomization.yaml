apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: next-

labels:
  - pairs:
      app.kubernetes.io/instance: next
    includeSelectors: true
    includeTemplates: true

# Reuse the production image pin; only runtime URLs change.
resources:
  - ../../overlays/catalogue

patches:
  - target:
      kind: ConfigMap
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: catalogue-tutors-app-config
      data:
        TUTORS_ORIGIN: "https://next.catalogue.tutors.dev"
        PUBLIC_READER_ORIGIN: "https://next.tutors.dev"
        PUBLIC_CATALOGUE_ORIGIN: "https://next.catalogue.tutors.dev"
        PUBLIC_LIVE_ORIGIN: "https://next.live.tutors.dev"
        PUBLIC_TIME_ORIGIN: "https://next.time.tutors.dev"
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: next-catalogue-tutors-app-secrets
