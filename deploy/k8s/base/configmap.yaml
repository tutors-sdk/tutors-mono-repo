apiVersion: v1
kind: ConfigMap
metadata:
  name: tutors-app-config
  labels:
    app.kubernetes.io/part-of: tutors
data:
  # Public URL of the app. adapter-node uses it to build absolute URLs and to
  # validate form submissions, so it must match the Route/Ingress host.
  ORIGIN: "https://tutors.dev"
  # Trust the proxy headers set by the OpenShift router / ingress controller.
  PROTOCOL_HEADER: "x-forwarded-proto"
  HOST_HEADER: "x-forwarded-host"
  ADDRESS_HEADER: "x-forwarded-for"
  XFF_DEPTH: "1"
  # Application settings (see .env.example). Set per environment.
  PUBLIC_SUPABASE_URL: ""
  PUBLIC_SUPABASE_ANON_KEY: ""
  PUBLIC_ANON_MODE: ""
  PUBLIC_PDF_KEY: ""
  LOG_LEVEL: "info"
  # Tutors Live. Where the reader posts events; empty disables the emitter.
  PUBLIC_LIVE_EVENTS_URL: ""
  # Pipeline adapters: memory | redis, memory | valkey, memory | postgres.
  # All empty means the memory pipeline, which needs no broker and no database.
  LIVE_BUS: ""
  LIVE_HOT_STORE: ""
  LIVE_WAREHOUSE: ""
  LIVE_REDIS_URL: ""
  LIVE_DATABASE_URL: ""
  LIVE_RETENTION_DAYS: "90"
  # Whether the live app also runs the ingest consumer. Empty follows the bus.
  LIVE_INGEST_IN_PROCESS: ""
  # Term windows for the out-of-term observation, as JSON.
  LIVE_TERMS: ""
