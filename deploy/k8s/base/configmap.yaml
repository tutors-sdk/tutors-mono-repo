apiVersion: v1
kind: ConfigMap
metadata:
  name: tutors-app-config
  labels:
    app.kubernetes.io/part-of: tutors
data:
  # Public URL metadata used to render the Route/Ingress host.
  # Kit 3 derives the request origin from the trusted proxy headers below.
  TUTORS_ORIGIN: "https://tutors.dev"
  # Cross-app links. Public dynamic env is read by SvelteKit at runtime.
  PUBLIC_READER_ORIGIN: "https://tutors.dev"
  PUBLIC_CATALOGUE_ORIGIN: "https://catalogue.tutors.dev"
  PUBLIC_LIVE_ORIGIN: "https://live.tutors.dev"
  PUBLIC_TIME_ORIGIN: "https://time.tutors.dev"
  # Trust the proxy headers set by the OpenShift router / ingress controller.
  PROTOCOL_HEADER: "x-forwarded-proto"
  HOST_HEADER: "x-forwarded-host"
  ADDRESS_HEADER: "x-forwarded-for"
  XFF_DEPTH: "1"
  # Application settings (see .env.example). Set per environment.
  PUBLIC_SUPABASE_URL: ""
  PUBLIC_SUPABASE_ANON_KEY: ""
  PUBLIC_ANON_MODE: ""
  PUBLIC_PDF_KEY: ""
  LOG_LEVEL: "info"
