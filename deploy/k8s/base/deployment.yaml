apiVersion: apps/v1
kind: Deployment
metadata:
  name: tutors-app
  labels:
    app.kubernetes.io/part-of: tutors
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tutors-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tutors-app
        app.kubernetes.io/part-of: tutors
    spec:
      containers:
        - name: app
          image: tutors-app:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tutors-app-config
                  key: origin
          envFrom:
            - configMapRef:
                name: tutors-app-config
            - secretRef:
                name: tutors-app-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
