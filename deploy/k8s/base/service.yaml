# ClusterIP Service on port 80 in front of the app pods' http port (3000 in deployment.yaml).
# Overlays add a name prefix and app labels. The optional Route or Ingress component and the
# ServiceMonitor component point at this Service.

apiVersion: v1
kind: Service
metadata:
  name: tutors-app
  labels:
    app.kubernetes.io/part-of: tutors
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tutors-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
