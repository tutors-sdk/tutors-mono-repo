apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: catalogue-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-catalogue
      app.kubernetes.io/component: catalogue
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-catalogue
    newTag: "17.0.0"
    digest: sha256:e9f2764654cb074d7dd4412ca163bf4c2666870444d5520361d5425bda4cec0b

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://catalogue.tutors.dev"
