apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: catalogue-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-catalogue
      app.kubernetes.io/component: catalogue
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-catalogue
    newTag: "17.1.0"
    digest: sha256:ecd47ce9b7cc160b8a913a31309e3b2aa637933988569d6aaedab3ae5fe78361

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://catalogue.tutors.dev"
