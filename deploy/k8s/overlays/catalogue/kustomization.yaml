apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: catalogue-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-catalogue
      app.kubernetes.io/component: catalogue
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: registry.example.com/tutors/catalogue
    newTag: "16.2.2"

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/ORIGIN
        value: "https://catalogue.tutors.dev"
