apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: time-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-time
      app.kubernetes.io/component: time
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-time
    newTag: "17.0.0"
    digest: sha256:d0a9f4a2f4624038ecea3629d1a536567756d458410bee43b45e060d738d195d

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://time.tutors.dev"
