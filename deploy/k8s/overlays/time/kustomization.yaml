apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: time-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-time
      app.kubernetes.io/component: time
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-time
    newTag: "16.2.2"
    digest: sha256:ddf3ad22b79bbba96199791a49367677bf9ad0ebdd7542f3246d56e7879d5e4e

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/ORIGIN
        value: "https://time.tutors.dev"
      # Moodle sync. MOODLE_WS_TOKEN is a secret: see secrets.yaml.example.
      - op: add
        path: /data/MOODLE_WS_URL
        value: ""
      - op: add
        path: /data/MOODLE_WS_REST_FORMAT
        value: "json"
      - op: add
        path: /data/SYNC_INTERVAL_MINUTES
        value: "60"
      # Course time data comes from the reader's /api/time with the viewer's
      # reader session; the reader lists this origin in PRIVATE_API_ALLOWED_ORIGINS.
      - op: add
        path: /data/PUBLIC_READER_URL
        value: "https://reader.tutors.dev"
