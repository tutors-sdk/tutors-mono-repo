apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: time-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-time
      app.kubernetes.io/component: time
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-time
    newTag: "17.1.0"
    digest: sha256:786e81c15a7a9537d71845df7e46efe49e3706df3c27656ee7d8072ada164b90

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://time.tutors.dev"
      # Course time data comes from the reader's /api/time with the viewer's
      # reader session; the reader lists this origin in PRIVATE_API_ALLOWED_ORIGINS.
      # It must be the host people sign in at (tutors.dev): the session cookie is host-only.
      - op: add
        path: /data/PUBLIC_READER_URL
        value: "https://tutors.dev"
