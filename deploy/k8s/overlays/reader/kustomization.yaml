apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: reader-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-reader
      app.kubernetes.io/component: reader
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-reader
    newTag: "17.0.0"
    digest: sha256:15e3aa22476d608db97e05917b1990ade0a7871e7ec6e113da5fec741b427233

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://reader.tutors.dev"
      # The time dashboard reads /api/time with the reader's session cookie.
      - op: add
        path: /data/PRIVATE_API_ALLOWED_ORIGINS
        value: "https://time.tutors.dev"
      # Logins that are educators of every course, and extra course hosts; usually empty.
      - op: add
        path: /data/PRIVATE_TUTORS_ADMINS
        value: ""
      - op: add
        path: /data/PRIVATE_COURSE_HOSTS
        value: ""

  # GitHub OAuth credentials for Better Auth. Create from secrets.yaml.example;
  # the secret is deliberately not managed by this kustomization.
  - target:
      kind: Deployment
      name: tutors-app
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: reader-tutors-app-oauth
