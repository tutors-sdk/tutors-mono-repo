# Service level objectives (issue #170; docs/slo.md). Indicative: what the college aims for, not a promise.
#
# Read by three things, so it is written once:
#   - observability/grafana/provisioning/alerting/alerts.yml, generated from it (pnpm slo:alerts), whose
#     burn-rate alerts page against these targets per app (Rule 0297);
#   - pnpm check:slo, on every release branch beside the claims (Rules 0295, 0296, 0298, 0299);
#   - the release harness (tutors-sdk/tutors-release-harness, harness 1.34.0), which fetches it from beside
#     release/claims.yaml and judges each candidate against it. The harness keeps its own floors (slo/floors.yaml
#     there) and judges the stricter of the two, so lowering a number here never loosens a release.
#
# availability: the share of responses that are not 5xx (http_requests_total by status_code).
# latency: the share of requests at or under `threshold` seconds, which must be a bucket bound of
#   http_request_duration_seconds (0.01, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10).
version: 1
window: 28d
objectives:
  - id: reader-availability
    app: reader
    kind: availability
    target: 0.995
    description: Students reading a course. The strictest app; about 3h22m of errors in 28 days.
  - id: reader-latency
    app: reader
    kind: latency
    threshold: 1
    target: 0.95
  - id: reader-latency-tail
    app: reader
    kind: latency
    threshold: 2.5
    target: 0.99
  - id: catalogue-availability
    app: catalogue
    kind: availability
    target: 0.99
  - id: catalogue-latency
    app: catalogue
    kind: latency
    threshold: 1
    target: 0.95
  - id: live-availability
    app: live
    kind: availability
    target: 0.99
  - id: live-latency
    app: live
    kind: latency
    threshold: 1
    target: 0.95
  - id: time-availability
    app: time
    kind: availability
    target: 0.99
  - id: time-latency
    app: time
    kind: latency
    threshold: 1
    target: 0.95
