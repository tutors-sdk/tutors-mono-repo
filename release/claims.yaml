# What this release meant to change, as the release harness will see it.
#
# The release harness (https://github.com/tutors-sdk/tutors-release-harness)
# runs the production images beside this candidate's images and diffs what a
# student can observe: DOM, screenshots, network, console, headers, axe,
# metrics, logs and timing, plus what the images and containers carry (image
# manifest, SBOM, vulnerabilities, runtime settings, startup). A claim says "this difference is intended, and
# here is the Rule or CHANGELOG entry that says so". Every difference must
# match a claim or the release run fails; a claim that matches nothing is
# reported as stale, so this file stays as honest as the changelog.
#
# An empty list is a statement too: nothing observable should differ between
# production and this release.
#
#   - artefact: dom                  # dom | screenshot | network | console | headers | axe
#                                    # | focus | metrics | logs | timing | persistence
#                                    # | bus | migration | upgrade | image-manifest | sbom | vulns
#                                    # | runtime | startup | "*"
#     scope: "reader:lab-step*"      # glob over the page key, its route, "<METHOD> <route>",
#                                    # "<page key>/<header>" or "<app>/<series>"
#     reason: "Rule 0031: lab steps shall show estimated reading time"
#                                    # a Rule id or CHANGELOG entry; "see PR" and "approved" are rejected
#     rule: "0031"                   # optional (harness contract 1.3.0): the Rule by id, checked against
#                                    # `pnpm release:rules`; then `reason` may be left out. An older
#                                    # harness ignores the key and still needs the `reason`
#     approvedBy: "a person"         # only for a broad claim (artefact "*", scope "*" or "**")
#
# Each CHANGELOG line names the artefacts it expects to move, e.g. "(axe, dom)":
# one claim per artefact, reason "CHANGELOG <version>: <the entry>" (CONTRIBUTING.md).
#
# Reset to `claims: []` when the next release branch is cut. Field reference:
# release/README.md here, claims/README.md in the harness repository.
claims:
  # Accessibility fixes the Paper rebuild (#313) made. axe found each on production
  # (16.2.2) and not on main, and the Main-to-RC run listed them as unclaimed.
  - artefact: axe
    scope: "reader-auth:sign-in"
    rule: "0216"
    reason: "sign-in button text contrast (color-contrast, serious) fixed by #313; page title added (document-title, serious)"
  - artefact: axe
    scope: "reference:course"
    rule: "0051"
    reason: "navigation dialog trigger no longer wraps a control (nested-interactive, serious) fixed by #313"
  - artefact: axe
    scope: "reference:topic"
    rule: "0051"
    reason: "navigation dialog trigger no longer wraps a control (nested-interactive, serious) fixed by #313"
  - artefact: axe
    scope: "reference:note"
    rule: "0036"
    reason: "code block copy buttons are named \"Copy code\" (button-name, critical) fixed by #313"
