# What this release meant to change, as the release harness will see it.
#
# The release harness (https://github.com/tutors-sdk/tutors-release-harness)
# runs the production images beside this candidate's images and diffs what a
# student can observe: DOM, screenshots, network, console, headers, axe,
# metrics, logs and timing, plus what the images and containers carry (image
# manifest, SBOM, vulnerabilities, runtime settings, startup). A claim says "this difference is intended, and
# here is the Rule or CHANGELOG entry that says so". Every difference must
# match a claim or the release run fails; a claim that matches nothing is
# reported as stale, so this file stays as honest as the changelog.
#
# An empty list is a statement too: nothing observable should differ between
# production and this release.
#
#   - artefact: dom                  # dom | screenshot | network | console | headers | axe
#                                    # | focus | metrics | logs | timing | persistence
#                                    # | bus | migration | upgrade | image-manifest | sbom | vulns
#                                    # | runtime | startup | image-hardening
#                                    # | build-provenance | vuln-ceiling | timing-tolerance
#                                    # | asset-graph | replay | slo | realtime | "*"
#     scope: "reader:lab-step*"      # glob over the page key, its route, "<METHOD> <route>",
#                                    # "<page key>/<header>" or "<app>/<series>"
#     reason: "Rule 0031: lab steps shall show estimated reading time"
#                                    # a Rule id or CHANGELOG entry; "see PR" and "approved" are rejected
#     rule: "0031"                   # optional (harness contract 1.3.0): the Rule by id, checked against
#                                    # `pnpm release:rules`; then `reason` may be left out. An older
#                                    # harness ignores the key and still needs the `reason`
#     approvedBy: "a person"         # only for a broad claim (artefact "*", scope "*" or "**")
#     until: "16.3.0"               # optional (harness 1.25.1): the last release, or day "2026-11-30",
#                                    # the claim is meant for; after it the claim is reported expired
#     digests:                       # optional (harness 1.25.1): the images it was written against
#       reader: "sha256:..."         # by app (reader, catalogue, live, time); another image expires it
#
# Each CHANGELOG line names the artefacts it expects to move, e.g. "(axe, dom)":
# one claim per artefact, reason "CHANGELOG <version>: <the entry>" (CONTRIBUTING.md).
#
# Reset to `claims: []` when the next release branch is cut, archiving the old list as
# release/claims/<version>.yaml (17.0.0's is there). Field reference:
# release/README.md here, claims/README.md in the harness repository.
claims:
  # Since 17.0.0 (Main to RC forecast of 15 Oct 2026, sha-d3d7227 beside 17.0.0): Tutors Live within a daily
  # Realtime budget (#476, #478, #481). The reader posts each learning event to its own server, which asks the
  # database which feeds to publish to and charges the day's budget.
  - artefact: network
    scope: "POST /api/live/activity"
    rule: "0330"
    reason: "Rule 0330: the reader sends each learning event to its own server (POST /api/live/activity) instead of broadcasting it from the browser (#481)"
  - artefact: persistence
    scope: "student-signs-in/realtime_claim_live_publish"
    rule: "0331"
    reason: "Rule 0331: the reader's server claims the topics to publish to, and charges the day's Live budget, through realtime_claim_live_publish (#481)"
  # One more immutable chunk on the reference course and note pages (JS 99 to 101 across the journey), first seen
  # the night #478 and #481 merged; the code split that moved learning events off browser Realtime.
  - artefact: network
    scope: "GET /_app/immutable/chunks/\\{\\{hash\\}\\}.js"
    rule: "0330"
    reason: "Rule 0330: moving learning events from browser Realtime to the reader's server adds one immutable chunk on reference:course and reference:note (#478, #481)"
  # Help requests in labs (Rules 0393, 0395 to 0399): a signed-in student's lab step gains a help
  # control (Ask for help, then a status chip) and reads the student's own request from the reader's
  # GET /api/assistance/mine; visitors and anonymous mode see no change. Tutors Live's course page
  # gains the help queue, read from the reader's GET /api/assistance with the lecturer's session.
  - artefact: dom
    scope: "reader:lab*"
    rule: "0399"
    reason: "Rule 0399: a signed-in student's lab step shows the help control; it is hidden from visitors and in anonymous mode"
  - artefact: screenshot
    scope: "reader:lab*"
    rule: "0399"
    reason: "Rule 0399: a signed-in student's lab step shows the help control; it is hidden from visitors and in anonymous mode"
  - artefact: network
    scope: "reader:lab*"
    rule: "0399"
    reason: "Rule 0399: a signed-in student's lab step reads their own help request from GET /api/assistance/mine"
  - artefact: dom
    scope: "live:*"
    rule: "0395"
    reason: "Rule 0395: Tutors Live's course page shows the course's help queue"
  - artefact: screenshot
    scope: "live:*"
    rule: "0395"
    reason: "Rule 0395: Tutors Live's course page shows the course's help queue"
  - artefact: network
    scope: "live:*"
    rule: "0393"
    reason: "Rule 0393: Tutors Live reads the course's help queue from the reader's GET /api/assistance every 60 seconds and on each notice"
