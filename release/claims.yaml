# What this release meant to change, as the release harness will see it.
#
# The release harness (https://github.com/tutors-sdk/tutors-release-harness)
# runs the production images beside this candidate's images and diffs what a
# student can observe: DOM, screenshots, network, console, headers, axe,
# metrics, logs and timing, plus what the images and containers carry (image
# manifest, SBOM, vulnerabilities, runtime settings, startup). A claim says "this difference is intended, and
# here is the Rule or CHANGELOG entry that says so". Every difference must
# match a claim or the release run fails; a claim that matches nothing is
# reported as stale, so this file stays as honest as the changelog.
#
# An empty list is a statement too: nothing observable should differ between
# production and this release.
#
#   - artefact: dom                  # dom | screenshot | network | console | headers | axe
#                                    # | focus | metrics | logs | timing | persistence
#                                    # | bus | migration | upgrade | image-manifest | sbom | vulns
#                                    # | runtime | startup | image-hardening
#                                    # | build-provenance | vuln-ceiling | timing-tolerance
#                                    # | asset-graph | replay | slo | realtime | "*"
#     scope: "reader:lab-step*"      # glob over the page key, its route, "<METHOD> <route>",
#                                    # "<page key>/<header>" or "<app>/<series>"
#     reason: "Rule 0031: lab steps shall show estimated reading time"
#                                    # a Rule id or CHANGELOG entry; "see PR" and "approved" are rejected
#     rule: "0031"                   # optional (harness contract 1.3.0): the Rule by id, checked against
#                                    # `pnpm release:rules`; then `reason` may be left out. An older
#                                    # harness ignores the key and still needs the `reason`
#     approvedBy: "a person"         # only for a broad claim (artefact "*", scope "*" or "**")
#     until: "16.3.0"               # optional (harness 1.25.1): the last release, or day "2026-11-30",
#                                    # the claim is meant for; after it the claim is reported expired
#     digests:                       # optional (harness 1.25.1): the images it was written against
#       reader: "sha256:..."         # by app (reader, catalogue, live, time); another image expires it
#
# Each CHANGELOG line names the artefacts it expects to move, e.g. "(axe, dom)":
# one claim per artefact, reason "CHANGELOG <version>: <the entry>" (CONTRIBUTING.md).
#
# Reset to `claims: []` when the next release branch is cut. Field reference:
# release/README.md here, claims/README.md in the harness repository.
claims:
  - artefact: migration
    scope: "app_errors:anon_select_app_errors"
    reason: "CHANGELOG Unreleased: app_errors is no longer readable with the anon key; the table has never existed on tutors-prod, so no deployed version reads it (migration)"
  - artefact: network
    scope: "reader:*"
    reason: "Rule 0072: the reader stores a signed-in student's data through its /api routes, under the session's login"
  - artefact: persistence
    scope: "reader:*"
    reason: "Rule 0072: student rows are written by the reader's server under the session's login, not by the browser"
  - artefact: dom
    scope: "reader:whiteboard*"
    reason: "Rule 0068: an anonymous visitor's whiteboard edits are not saved, and the status line says so"
  - artefact: network
    scope: "time:*"
    reason: "CHANGELOG Unreleased (Time): the dashboard loads time data from the reader"
  - artefact: dom
    scope: "time:*"
    reason: "CHANGELOG Unreleased (Time): signed-out viewers see a sign-in link"
  - artefact: screenshot
    scope: "time:*"
    reason: "CHANGELOG Unreleased (Time): signed-out viewers see a sign-in link"
  - artefact: network
    scope: "catalogue:*"
    reason: "Rule 0070: the catalogue shows the number of students without reading any student's profile"
  # Accessibility fixes the Paper rebuild (#313) made. axe found each on production
  # (16.2.2) and not on main, and the Main-to-RC run listed them as unclaimed.
  - artefact: axe
    scope: "reader-auth:sign-in"
    rule: "0216"
    reason: "sign-in button text contrast (color-contrast, serious) fixed by #313; page title added (document-title, serious)"
  - artefact: axe
    scope: "reference:course"
    rule: "0051"
    reason: "navigation dialog trigger no longer wraps a control (nested-interactive, serious) fixed by #313"
  - artefact: axe
    scope: "reference:topic"
    rule: "0051"
    reason: "navigation dialog trigger no longer wraps a control (nested-interactive, serious) fixed by #313"
  - artefact: axe
    scope: "reference:note"
    rule: "0036"
    reason: "code block copy buttons are named \"Copy code\" (button-name, critical) fixed by #313"
  # PR #143 (commit 4070315) dropped npm, npx, corepack and yarn from the runtime image: npm's bundled tar and
  # brace-expansion failed the Trivy gate, and the runtime only runs `node build/index.js`. The SBOM of each of the
  # four images loses the same 174 packages (696 diffs). One claim, the exact package list, generated from the
  # Main-to-RC report with the jq in the harness's claims/README.md ("A tool removed from an image"). The 72
  # advisories that left with npm are vulns info hunks and need no claim.
  - artefact: sbom
    scope: "*/{@isaacs/cliui,@isaacs/fs-minipass,@isaacs/string-locale-compare,@npmcli/agent,@npmcli/arborist,@npmcli/config,@npmcli/fs,@npmcli/git,@npmcli/installed-package-contents,@npmcli/map-workspaces,@npmcli/metavuln-calculator,@npmcli/name-from-folder,@npmcli/node-gyp,@npmcli/package-json,@npmcli/promise-spawn,@npmcli/query,@npmcli/redact,@npmcli/run-script,@pkgjs/parseargs,@sigstore/bundle,@sigstore/core,@sigstore/protobuf-specs,@sigstore/sign,@sigstore/tuf,@sigstore/verify,@tufjs/canonical-json,@tufjs/models,abbrev,agent-base,ansi-regex,ansi-styles,aproba,archy,balanced-match,bin-links,binary-extensions,brace-expansion,cacache,chalk,chownr,ci-info,cidr-regex,cli-columns,cmd-shim,color-convert,color-name,common-ancestor-path,corepack,cross-spawn,cssesc,debug,diff,eastasianwidth,emoji-regex,encoding,env-paths,err-code,exponential-backoff,fastest-levenshtein,fdir,foreground-child,fs-minipass,glob,graceful-fs,hosted-git-info,http-cache-semantics,http-proxy-agent,https-proxy-agent,iconv-lite,ignore-walk,imurmurhash,ini,init-package-json,ip-address,ip-regex,is-cidr,is-fullwidth-code-point,isexe,jackspeak,json-parse-even-better-errors,json-stringify-nice,jsonparse,just-diff,just-diff-apply,libnpmaccess,libnpmdiff,libnpmexec,libnpmfund,libnpmhook,libnpmorg,libnpmpack,libnpmpublish,libnpmsearch,libnpmteam,libnpmversion,lru-cache,make-fetch-happen,minimatch,minipass,minipass-collect,minipass-fetch,minipass-flush,minipass-pipeline,minipass-sized,minizlib,ms,mute-stream,negotiator,node-gyp,nopt,normalize-package-data,npm,npm-audit-report,npm-bundled,npm-install-checks,npm-normalize-package-bin,npm-package-arg,npm-packlist,npm-pick-manifest,npm-profile,npm-registry-fetch,npm-user-validate,p-map,package-json-from-dist,pacote,parse-conflict-json,path-key,path-scurry,picomatch,postcss-selector-parser,proc-log,proggy,promise-all-reject-late,promise-call-limit,promise-retry,promzard,qrcode-terminal,read,read-cmd-shim,read-package-json-fast,retry,safer-buffer,semver,shebang-command,shebang-regex,signal-exit,sigstore,smart-buffer,socks,socks-proxy-agent,spdx-correct,spdx-exceptions,spdx-expression-parse,spdx-license-ids,ssri,string-width,strip-ansi,supports-color,text-table,tiny-relative-date,tinyglobby,treeverse,tuf-js,unique-filename,unique-slug,util-deprecate,validate-npm-package-license,validate-npm-package-name,walk-up-path,which,wrap-ansi,write-file-atomic,yallist,yarn}"
    rule: "0220"
    reason: "runtime image ships no package manager: npm, npx, corepack and yarn removed by #143 (4070315), rationale in tests/bdd/features/developer/runtime-image.feature"
  # PR #475: each page view and each 30 seconds of activity is one database function call
  # (record_page_view, record_heartbeat) instead of several read-then-write requests. The signed-in journey's
  # writes move from the per-table requests to the two functions; both functions ship in
  # supabase/migrations/20261014_record_page_view_and_heartbeat.sql (additions only).
  - artefact: persistence
    scope: "*/record_page_view"
    rule: "0303"
    reason: "a page view is recorded against the learning object and the day's calendar in one request (#475)"
  - artefact: persistence
    scope: "*/{learning_records,calendar,get_count_learning_records}"
    rule: "0303"
    reason: "the per-table page-view requests are replaced by record_page_view (#475)"
  - artefact: persistence
    scope: "*/record_heartbeat"
    rule: "0304"
    reason: "each 30 seconds of activity on a visible course page is one request (#475)"
  - artefact: persistence
    scope: "*/increment_calendar"
    rule: "0304"
    reason: "the calendar's time-active increment is replaced by record_heartbeat (#475)"

  # ---------------------------------------------------------------------------
  # 17.0.0. Production is 16.2.2, so the claims above have still not shipped and
  # stay. What follows is this release's own intended differences.
  #
  # The Paper rebuild (#313, #331) redraws every page of all four apps, so its
  # dom, screenshot and axe claims are one per app rather than one per page:
  # there is no page it does not touch. They carry `until: "17.0.0"` so they
  # expire with this release instead of covering the next one silently.
  # ---------------------------------------------------------------------------

  - artefact: dom
    scope: "reader:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Reader: Tutors is rebuilt on the Paper design system (Rules 0019-0058, #313)"
    until: "17.0.0"
  - artefact: screenshot
    scope: "reader:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Reader: Tutors is rebuilt on the Paper design system (Rules 0019-0058, #313)"
    until: "17.0.0"
  - artefact: axe
    scope: "reader:*"
    rule: "0051"
    reason: "CHANGELOG 17.0.0 Reader: course pages carry no critical or serious WCAG 2.1 AA violations after the Paper rebuild (#313, #338, #364, #420)"
    until: "17.0.0"
  - artefact: dom
    scope: "live:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Live: Live is brought onto the Paper design system and the reader's UX patterns (#313, #331)"
    until: "17.0.0"
  - artefact: screenshot
    scope: "live:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Live: Live is brought onto the Paper design system and the reader's UX patterns (#313, #331)"
    until: "17.0.0"
  - artefact: axe
    scope: "live:*"
    rule: "0051"
    reason: "CHANGELOG 17.0.0 Live: Live is brought onto the Paper design system and the reader's UX patterns (#313, #331)"
    until: "17.0.0"
  - artefact: dom
    scope: "catalogue:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Catalogue: the catalogue is brought onto the Paper design system (#313, #331)"
    until: "17.0.0"
  - artefact: screenshot
    scope: "catalogue:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Catalogue: the catalogue is brought onto the Paper design system (#313, #331)"
    until: "17.0.0"
  - artefact: axe
    scope: "catalogue:*"
    rule: "0173"
    reason: "CHANGELOG 17.0.0 Catalogue: every link in the catalogue header has an accessible name no other header link shares (#338)"
    until: "17.0.0"
  - artefact: dom
    scope: "time:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Time: Time is brought onto the Paper design system (#313, #331)"
    until: "17.0.0"
  - artefact: screenshot
    scope: "time:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Time: Time is brought onto the Paper design system (#313, #331)"
    until: "17.0.0"
  - artefact: axe
    scope: "time:*"
    rule: "0019"
    reason: "CHANGELOG 17.0.0 Time: Time is brought onto the Paper design system (#313, #331)"
    until: "17.0.0"

  # Sign-in moves from Auth.js at /auth to Better Auth at /api/auth: the old
  # routes 404 and the new ones appear, and the session cookie is a new one.
  - artefact: network
    scope: "*/api/auth/*"
    rule: "0250"
    reason: "CHANGELOG 17.0.0 Reader: the GitHub OAuth callback URL has moved to /api/auth/callback/github (#417, #461, #463)"
  - artefact: network
    scope: "*/auth/*"
    rule: "0250"
    reason: "CHANGELOG 17.0.0 Reader: the Auth.js routes under /auth are gone with the move to Better Auth (#463)"
  - artefact: headers
    scope: "reader:*"
    rule: "0259"
    reason: "CHANGELOG 17.0.0 Reader: the session cookie is Better Auth's, set HttpOnly, Secure and SameSite=Lax (#417, #461)"
  - artefact: dom
    scope: "reader-auth:sign-in"
    rule: "0250"
    reason: "CHANGELOG 17.0.0 Reader: sign-in runs on Better Auth (#417, #461, #463)"

  # Realtime: the reader stops joining channels it never read, and the online
  # list is read from stored activity instead of broadcast.
  - artefact: network
    scope: "reader:*"
    rule: "0317"
    reason: "CHANGELOG 17.0.0 Reader: readers no longer join a course Realtime channel; the online list is read from stored activity (#414, #429, #474)"
  - artefact: bus
    scope: "reader:*"
    rule: "0271"
    reason: "CHANGELOG 17.0.0 Reader: the reader no longer subscribes to tutors-all-course-access and course activity channels (#414, #429, #474)"
  - artefact: bus
    scope: "live:*"
    rule: "0272"
    reason: "CHANGELOG 17.0.0 Live: Live's landing page is the only subscriber to tutors-all-course-access (#414, #429, #474)"

  # The two migrations this release needs applied, both additions only.
  - artefact: migration
    scope: "*/idx_tutors_connect_latest_course_recent"
    rule: "0317"
    reason: "CHANGELOG 17.0.0 Infrastructure: 20261013_tutors_connect_latest_recent_index.sql indexes (course_id, received_at DESC) for the online list (#474)"
  - artefact: migration
    scope: "*/record_page_view"
    rule: "0303"
    reason: "CHANGELOG 17.0.0 Infrastructure: 20261014_record_page_view_and_heartbeat.sql adds record_page_view (#475)"
  - artefact: migration
    scope: "*/record_heartbeat"
    rule: "0304"
    reason: "CHANGELOG 17.0.0 Infrastructure: 20261014_record_page_view_and_heartbeat.sql adds record_heartbeat (#475)"

  # Deterministic responses and a stable log and metrics shape (#282, #283)
  # landed after 16.2.2, so production still emits the older shapes.
  - artefact: logs
    scope: "reader:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable log and metrics shape, and variable data kept out of log messages (#283, #297)"
    until: "17.0.0"
  - artefact: logs
    scope: "live:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable log and metrics shape (#283)"
    until: "17.0.0"
  - artefact: logs
    scope: "catalogue:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable log and metrics shape (#283)"
    until: "17.0.0"
  - artefact: logs
    scope: "time:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable log and metrics shape (#283)"
    until: "17.0.0"
  - artefact: metrics
    scope: "reader:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable metrics shape for release-harness A/A runs (#283)"
    until: "17.0.0"
  - artefact: metrics
    scope: "live:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable metrics shape for release-harness A/A runs (#283)"
    until: "17.0.0"
  - artefact: metrics
    scope: "catalogue:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable metrics shape for release-harness A/A runs (#283)"
    until: "17.0.0"
  - artefact: metrics
    scope: "time:*"
    reason: "CHANGELOG 17.0.0 Infrastructure: stable metrics shape for release-harness A/A runs (#283)"
    until: "17.0.0"

  # SvelteKit 3 rewrites the build output of all four apps. asset-graph is an
  # informing check, claimed so the report reads as intended rather than noisy.
  - artefact: asset-graph
    scope: "reader:*"
    reason: "CHANGELOG 17.0.0 Reader: the reader runs on SvelteKit 3 (#466)"
    until: "17.0.0"
  - artefact: asset-graph
    scope: "live:*"
    reason: "CHANGELOG 17.0.0 Live: Live runs on SvelteKit 3 (#466)"
    until: "17.0.0"
  - artefact: asset-graph
    scope: "catalogue:*"
    reason: "CHANGELOG 17.0.0 Catalogue: the catalogue runs on SvelteKit 3 (#466)"
    until: "17.0.0"
  - artefact: asset-graph
    scope: "time:*"
    reason: "CHANGELOG 17.0.0 Time: Time runs on SvelteKit 3 (#466)"
    until: "17.0.0"
