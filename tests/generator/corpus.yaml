# Generator differential corpus (runway tier C). Every entry is generated by
# the base ref and by the working tree, and every difference must be claimed
# in claims.yaml. Checked by scripts/checks/generator-diff.ts.
#
# Remote courses are pinned by full commit SHA so a PR diff only ever reflects
# a generator change. Entries with `nightly: true` are also generated at their
# upstream HEAD every night and compared with the previous night, which is how
# upstream content changes (a new front-matter key, a new folder shape) surface.
corpus:
  # Committed synthetic course: every learning object type, Unicode titles and
  # file names, an empty topic, a hidden topic and a folder the generator prunes.
  - name: synthetic
    path: tests/generator/corpus/synthetic-course
    generators: [tutors, tutors-lite]

  # The reference course the reader, a11y and release suites already use.
  - name: reference-course
    repo: https://github.com/tutors-sdk/tutors-reference-course.git
    commit: 78b771238c58bcb3d97d6ef3eb8fa41c02359a23
    generators: [tutors, tutors-lite]
    nightly: true

  # Committed portfolio: properties.yaml sets portfolio, and the topics hold web links to module
  # courses, the shape of the harness's standard course (wit-hdip-comp-sci-2024). No public portfolio
  # source repo is in tutors-sdk to pin, so it is synthetic.
  - name: synthetic-portfolio
    path: tests/generator/corpus/synthetic-portfolio
    generators: [tutors, tutors-lite]

  # A real module course: notebooks, labs with numbered steps, a calendar. Pinned only; it changes
  # often upstream, so it is left out of the nightly upstream-HEAD comparison.
  - name: python
    repo: https://github.com/tutors-sdk/python.git
    commit: ab84bc06743b2b968222f5a2a3c05c3ec2ae02e6
    generators: [tutors, tutors-lite]
