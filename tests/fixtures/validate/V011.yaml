fixed:
  course.md: "# Web Development\n"
  topic-01/topic.md: "# Week one\n"
  topic-01/talk-01/talk.md: "# Intro\n"
  topic-01/talk-01/slides.pdf: "%PDF"
  netlify.toml: |
    # Build & publish this Tutors course straight from Git.
    # Connect the repository in Netlify; no other settings needed.

    [build]
      command = "deno run -A jsr:@tutors/tutors"
      publish = "json"

    # The site is read by the tutors.dev reader, which fetches tutors.json
    # cross-origin - allow that, and bounce direct visits to the reader.
    [[redirects]]
      from = "/*"
      to = "/index.html"
      status = 200

    [[headers]]
      for = "/*"
      [headers.values]
        Access-Control-Allow-Origin = "*"
