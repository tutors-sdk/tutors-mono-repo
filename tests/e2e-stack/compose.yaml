# E2E stack for runway tier G: the built app images plus a fixture course
# server, in anonymous mode. Never `vite dev`.
#
#   deno run -A tests/e2e-stack/fixture-course/build.ts
#   docker compose -f tests/e2e-stack/compose.yaml up -d --wait
#   pnpm test:e2e:stack
#
# Images default to tutors/<app>:local (docker compose up --build at the repo
# root, or `docker build --build-arg APP_NAME=<app> -t tutors/<app>:local .`).
# CI sets TUTORS_TAG=ci. The release harness will point two copies of this
# stack at two tags.
#
# The signed-in half (proxy-signed-in and below) runs the reader, Live and the time app with sign-in on,
# against the release harness's identity stub (GitHub OAuth, fixtures/identity) and persistence stub
# (Supabase REST and Realtime, fixtures/persistence), so the signed-in journeys (signed-in.journey.spec.ts)
# sign people in, write and read back without GitHub or Supabase.
name: tutors-e2e

networks:
  default:
    ipam:
      config:
        # Fixed so the apps' extra_hosts can point github.com at the identity stub and
        # persistence.e2e.test at the persistence stub. Every other container takes an address from
        # ip_range, so none can take .10 or .11 before the stubs start ("Address already in use").
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

# Sign-in on: GitHub OAuth goes to the identity stub (github.com resolves to it, its CA is trusted) and
# Supabase to the persistence stub. Not real secrets; they exist only inside this stack. HARNESS_NOW is the
# clock fixture the apps honour (@tutors/runtime clock), so the calendar and time views are deterministic.
x-signed-in-env: &signed-in-env
  PUBLIC_ANON_MODE: ""
  LOG_LEVEL: info
  HARNESS_NOW: ${HARNESS_NOW:-2026-09-16T09:05:00.000Z}
  PRIVATE_AUTH_SECRET: e2e-stack-only-not-a-real-secret-0000000000
  PRIVATE_AUTH_GITHUB_ID: e2e-client-id
  PRIVATE_AUTH_GITHUB_SECRET: e2e-client-secret
  PUBLIC_SUPABASE_URL: http://persistence.e2e.test:8090
  PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
  # The reader writes content locks and Moodle rows with the service key (Rules 0630, 0633); the stub takes any key.
  PRIVATE_SUPABASE_SERVICE_ROLE_KEY: e2e-service-key
  PUBLIC_READER_URL: http://localhost:3100
  PRIVATE_API_ALLOWED_ORIGINS: http://localhost:3104
  # Moodle is the persistence stub's web service (Rule 0640); the token is not checked.
  MOODLE_WS_URL: http://persistence.e2e.test:8090/moodle/webservice/rest/server.php
  MOODLE_WS_TOKEN: e2e-moodle-token
  MOODLE_WS_REST_FORMAT: json
  SYNC_INTERVAL_MINUTES: "60"
  NODE_EXTRA_CA_CERTS: /e2e/ca.pem
  PROTOCOL_HEADER: x-forwarded-proto
  HOST_HEADER: x-forwarded-host
  # /metrics answers only this bearer token (the authorisation matrix's operator, Rule 0621).
  METRICS_TOKEN: e2e-metrics-token

x-signed-in-hosts: &signed-in-hosts
  - "github.com:172.30.0.10"
  - "api.github.com:172.30.0.10"
  - "persistence.e2e.test:172.30.0.11"
  # The enrollment export reads the course from Netlify by name; the identity stub answers it (Rule 0621).
  - "harness-rules.netlify.app:172.30.0.10"
  - "harness-public.netlify.app:172.30.0.10"

x-stub: &stub
  image: node:22-bookworm-slim
  init: true
  read_only: true
  user: "1001:0"

x-app: &app
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &app-env
    PUBLIC_ANON_MODE: "TRUE"
    LOG_LEVEL: info
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/healthz/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 2s
    timeout: 3s
    retries: 30

services:
  proxy:
    image: docker.io/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries a file capability and needs it in the bounding set to execute.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:uid=1001,gid=1001
      - /config:uid=1001,gid=1001
    volumes:
      - ../../deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${READER_PORT:-3000}:3000"
      - "${CATALOGUE_PORT:-3001}:3001"
      - "${LIVE_PORT:-3002}:3002"
      - "${READER_UNCONFIGURED_PORT:-3005}:3005"

  course: &course
    image: node:22-bookworm-slim
    init: true
    read_only: true
    user: "1001:0"
    command: ["node", "/fixture/serve.mjs", "/srv/course", "8080"]
    volumes:
      - ./fixture-course/serve.mjs:/fixture/serve.mjs:ro
      - ./work/course:/srv/course:ro
    # The browser fetches the course directly (course pages are client-rendered),
    # so the fixture is published on the host at the course id's port.
    ports:
      - "${COURSE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Negative fixture: the same course, but tutors.json answers 500. The
  # negative journey must fail against it (tests/e2e-stack/journeys/negative.journey.spec.ts).
  course-broken:
    <<: *course
    environment:
      FIXTURE_FAULT: "500"
    ports:
      - "${BROKEN_COURSE_PORT:-8081}:8080"

  # Resilience fixture: the same course, but tutors.json is accepted and never answered (Rule 0614).
  course-stalled:
    <<: *course
    environment:
      FIXTURE_FAULT: "hang"
    ports:
      - "${STALLED_COURSE_PORT:-8083}:8080"

  reader:
    <<: *app
    image: tutors/reader:${TUTORS_TAG:-local}
    environment:
      <<: *app-env
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Anonymous mode with a secret set, as a deployment that also offers sign-in
      # would run it. reader-unconfigured below runs with no secret at all; this
      # value exists only for the E2E stack.
      PRIVATE_AUTH_SECRET: e2e-stack-only-not-a-real-secret-0000000000
    depends_on:
      course:
        condition: service_healthy

  # The reader exactly as the root compose.yaml starts it with no .env: anonymous
  # mode and no auth configuration. Journeys expect this to serve the home page.
  reader-unconfigured:
    <<: *app
    image: tutors/reader:${TUTORS_TAG:-local}
    environment:
      <<: *app-env
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  catalogue:
    <<: *app
    image: tutors/catalogue:${TUTORS_TAG:-local}
    environment:
      <<: *app-env
      # The authorisation matrix's operator (Rule 0621): /metrics answers only this bearer token.
      METRICS_TOKEN: e2e-metrics-token
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  live:
    <<: *app
    image: tutors/live:${TUTORS_TAG:-local}
    environment:
      <<: *app-env
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  # ---- signed in ---------------------------------------------------------
  proxy-signed-in:
    image: docker.io/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:uid=1001,gid=1001
      - /config:uid=1001,gid=1001
    volumes:
      - ./Caddyfile.signed-in:/etc/caddy/Caddyfile:ro
    ports:
      - "${READER_SIGNED_IN_PORT:-3100}:3100"
      - "${LIVE_SIGNED_IN_PORT:-3102}:3102"
      - "${TIME_SIGNED_IN_PORT:-3104}:3104"

  # The signed-in course: private, an enrollment list, a quiz and a calendar (fixture-course/build-signed-in.ts).
  course-signed-in:
    <<: *course
    command: ["node", "/fixture/serve.mjs", "/srv/course", "8080"]
    volumes:
      - ./fixture-course/serve.mjs:/fixture/serve.mjs:ro
      - ./work/signed-in-course:/srv/course:ro
    ports:
      - "${SIGNED_IN_COURSE_PORT:-8082}:8080"

  identity:
    <<: *stub
    command: ["node", "/fixture/stub.mjs"]
    environment:
      PORT: "443"
      COURSE_ORIGIN: http://course-signed-in:8080
      PUBLIC_COURSE_ORIGIN: http://course:8080
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./fixtures/identity/stub.mjs:/fixture/stub.mjs:ro
      - ./fixtures/identity/certs:/fixture/certs:ro
    networks:
      default:
        ipv4_address: 172.30.0.10
    ports:
      - "${IDENTITY_PORT:-8443}:443"
    healthcheck:
      # The stub's certificate is signed by the stack's test CA, which the healthcheck's Node does not trust.
      test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://127.0.0.1:443/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 15

  persistence:
    <<: *stub
    command: ["node", "/fixture/stub.mjs", "8090"]
    volumes:
      - ./fixtures/persistence/stub.mjs:/fixture/stub.mjs:ro
    networks:
      default:
        ipv4_address: 172.30.0.11
    # The browser reaches it as persistence.e2e.test too, mapped to 127.0.0.1 (playwright.e2e-stack.config.ts).
    ports:
      - "${PERSISTENCE_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15

  reader-signed-in:
    <<: *app
    image: tutors/reader:${TUTORS_TAG:-local}
    extra_hosts: *signed-in-hosts
    volumes:
      - ./fixtures/identity/certs/ca.pem:/e2e/ca.pem:ro
    environment:
      <<: *signed-in-env
    depends_on:
      course-signed-in:
        condition: service_healthy
      identity:
        condition: service_healthy
      persistence:
        condition: service_healthy

  live-signed-in:
    <<: *app
    image: tutors/live:${TUTORS_TAG:-local}
    extra_hosts: *signed-in-hosts
    volumes:
      - ./fixtures/identity/certs/ca.pem:/e2e/ca.pem:ro
    environment:
      <<: *signed-in-env
    depends_on:
      persistence:
        condition: service_healthy

  time-signed-in:
    <<: *app
    image: tutors/time:${TUTORS_TAG:-local}
    extra_hosts: *signed-in-hosts
    volumes:
      - ./fixtures/identity/certs/ca.pem:/e2e/ca.pem:ro
    environment:
      <<: *signed-in-env
    depends_on:
      persistence:
        condition: service_healthy
